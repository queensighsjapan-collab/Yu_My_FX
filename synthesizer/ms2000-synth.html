<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:dark}body{margin:0;font-size:14px}</style>
<title>MS2000風シンセ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DotGothic16&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root{
  /* Layout: a fixed 1700px-wide hardware panel; narrow screens scroll sideways.
     Left column: display and patch bay. Middle: oscillators to LFOs. Right: effects, pitch, arpeggiator. Keys and wheels below. */
  --bg:#0e1315; --fg:#dce7e5; --muted:#8ea3a0;
  --panel-a:#227991; --panel-b:#16596f; --ink:#f2f7f5; --rule:rgba(242,247,245,.55);
  --wood-a:#5a2315; --wood-b:#2b100a; --wood-hi:#80361f;
  --lcd-bg:#a9bd5c; --lcd-fg:#18240a; --lcd-grid:rgba(169,189,92,.6);
  --led:#ff5238; --led-off:#52211a;
  --f-label:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-lcd:'DotGothic16','Courier New',monospace;
  --f-ui:'Noto Sans JP',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-ui);
  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.top{max-width:980px;margin:0 0 16px}
h1{font:500 20px/1.3 var(--f-ui);margin:0 0 6px;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.midi{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:14px 0 0;font:500 12px/1.4 var(--f-ui);color:var(--muted)}
.midi label{display:flex;align-items:center;gap:6px}
.midi select{background:var(--bg);color:var(--fg);border:1px solid var(--muted);border-radius:4px;padding:5px 8px;font:inherit;max-width:260px}
.midi select:focus-visible,.mbtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mbtn{appearance:none;background:transparent;color:var(--fg);border:1px solid var(--muted);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
.mbtn:hover{border-color:var(--fg)}
.mbtn.on{color:var(--lcd-bg);border-color:var(--lcd-bg)}
.mled{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--led-off)}
.mled.on{background:var(--led);box-shadow:0 0 6px var(--led)}
.mstat{min-width:12em}
.back{display:inline-block;margin:0 0 14px;padding:6px 14px;border:1px solid var(--muted);border-radius:20px;color:var(--muted);font:500 11px/1 var(--f-label);letter-spacing:.18em;text-decoration:none;transition:color .2s,border-color .2s}
.back:hover,.back:focus-visible{color:var(--fg);border-color:var(--fg);outline:none}
.foot{margin:14px 0 0;color:var(--muted);font-size:12px;line-height:1.7}

.scroller{overflow-x:auto;overflow-y:hidden}
.sizer{width:1700px}
.stage{width:1700px}

/* instrument body */
.synth{display:grid;grid-template-columns:36px 1fr 36px;border-radius:8px;overflow:hidden;
  box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05)}
.wood{
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px,rgba(255,170,110,.05) 3px 5px,rgba(0,0,0,.12) 5px 6px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 7px,rgba(0,0,0,0) 7px 13px,rgba(130,55,28,.25) 13px 16px),
    linear-gradient(90deg,var(--wood-b),var(--wood-a) 45%,var(--wood-hi) 60%,var(--wood-b));
}
.main{display:flex;flex-direction:column;min-width:0}
.panel{
  display:grid;grid-template-columns:270px 1fr 400px;gap:18px;padding:16px 22px 14px;color:var(--ink);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,rgba(0,0,0,0) 1px 3px),
    linear-gradient(180deg,var(--panel-a),var(--panel-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -12px 20px rgba(0,0,0,.22);
}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col>.srow,.col>.sec.vp{flex:1}
.srow{display:flex;gap:16px;min-width:0}
.srow>.sec{flex:1 1 auto}

/* sections */
.sec{display:flex;flex-direction:column;min-width:0}
.sec>h3{margin:0 0 4px;display:flex;align-items:center;gap:8px;font:600 11px/1 var(--f-label);letter-spacing:.16em;color:var(--ink)}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.row{display:flex;align-items:stretch;justify-content:space-around;gap:2px;flex:1}
.ctl{display:grid;grid-template-rows:1fr auto auto;justify-items:center;align-items:center;gap:2px;min-width:0}
.ctl>svg{align-self:center}
.lbl{font:600 10px/1.05 var(--f-label);letter-spacing:.04em;text-align:center;color:var(--ink);text-transform:uppercase;white-space:nowrap}
.ro{font:500 9.5px/1 var(--f-label);letter-spacing:.04em;color:#d3ebe5;white-space:nowrap;min-height:10px}
.stack{display:flex;flex-direction:column;justify-content:space-around;gap:4px}

/* knobs */
.knob{display:block;overflow:visible;cursor:ns-resize;touch-action:none;outline:none}
.knob:focus-visible{filter:drop-shadow(0 0 3px #fff)}
.knob .tk{stroke:rgba(242,247,245,.85);stroke-width:1;stroke-linecap:round}
.knob .t{fill:var(--ink);font:600 8.5px var(--f-label);letter-spacing:.05em;opacity:.8}
.knob .t.on{opacity:1;font-weight:700}

/* buttons */
.bctl .bt{display:flex;flex-direction:column;align-items:center;gap:4px}
.led{display:block;width:6px;height:6px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.led.on{background:var(--led);box-shadow:0 0 6px 1px rgba(255,82,56,.75)}
.cap{appearance:none;border:0;padding:0;width:30px;height:15px;border-radius:2px;cursor:pointer;
  background:linear-gradient(#6a7174,#2c3234);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 3px rgba(0,0,0,.55)}
.cap:active,.cap[aria-pressed="true"]{background:linear-gradient(#2c3234,#40474a);transform:translateY(1px);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.cap:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* left column */
.brand{display:flex;flex-direction:column;gap:3px}
.wm{font:700 30px/1 var(--f-label);letter-spacing:.14em;color:var(--ink)}
.wm-sub{font:500 10px/1 var(--f-label);letter-spacing:.2em;color:#d3ebe5}
.lcd{position:relative;background:var(--lcd-bg);border-radius:3px;padding:8px 10px;width:244px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 0 0 3px #0b1113,0 0 0 4px rgba(255,255,255,.14)}
.lcd::after{content:"";position:absolute;inset:8px 10px;pointer-events:none;
  background-image:linear-gradient(transparent 2px,var(--lcd-grid) 2px 3px),linear-gradient(90deg,transparent 2px,var(--lcd-grid) 2px 3px);
  background-size:3px 3px}
.ln{display:flex;height:24px}
.ch{display:block;width:14px;font:400 19px/24px var(--f-lcd);color:var(--lcd-fg);text-align:center;white-space:pre}
.brow{display:flex;justify-content:space-around;padding-top:2px}
.vph,.vpr{display:grid;grid-template-columns:14px repeat(3,1fr);align-items:center;justify-items:center}
.vph{font:600 9px/1 var(--f-label);letter-spacing:.1em;color:#d3ebe5;margin-bottom:2px}
.vpr b{font:700 12px var(--f-label);color:var(--ink)}
.vpr .ctl{width:100%}
.sec.vp .row{flex-direction:column;justify-content:space-between;gap:0}

/* mod sequence */
.steps{flex:1 1 90px;min-width:0;display:flex;gap:2px;align-self:stretch;margin-left:6px;touch-action:none;cursor:ns-resize;padding-block:4px}
.st{flex:1;position:relative;background:rgba(0,0,0,.3);border-radius:1px}
.st i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.9}
.sec.grow{flex:1 1 0;min-width:0}
.seqrow{align-items:center;justify-content:flex-start}

/* keyboard deck */
.deck{display:flex;background:linear-gradient(#0c1012,#151a1c);border-top:3px solid #080b0c}
.deck-l{width:226px;flex:none;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:16px 18px 14px}
.oct{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:4px}
.oct .row2{display:flex;flex-direction:column;gap:10px}
.dl{font:600 10px/1.1 var(--f-label);letter-spacing:.08em;color:#c9d6d3;text-align:center;text-transform:uppercase}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.wh{position:relative;width:38px;height:150px;border-radius:6px;background:#050607;overflow:hidden;cursor:ns-resize;touch-action:none;
  box-shadow:inset 0 0 0 2px #1d2224,0 1px 0 rgba(255,255,255,.08)}
.wh .rg{position:absolute;inset:3px;border-radius:4px;
  background:repeating-linear-gradient(180deg,#2c3032 0 2px,#101213 2px 5px,#3d4244 5px 6px,#0c0d0e 6px 9px)}
.wh::after{content:"";position:absolute;inset:3px;border-radius:4px;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 72%,rgba(0,0,0,.85))}
.wh .mk{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(255,82,56,.7);z-index:2}
.keys{position:relative;width:1378px;height:196px;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.wk,.bk{position:absolute;top:0;cursor:pointer}
.wk{width:52px;height:196px;border-radius:0 0 4px 4px;
  background:linear-gradient(180deg,#d9d5cb 0,#f7f4ee 8%,#ebe7de 86%,#c9c4b8 100%);box-shadow:inset -1px 0 #b9b4a8}
.wk.down{background:linear-gradient(180deg,#b9b5aa 0,#dcd8cd 10%,#cfcabe 100%);transform:translateY(1px)}
.bk{width:32px;height:120px;z-index:2;border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,#303435 0,#101213 70%,#050606 100%);box-shadow:inset 1px 0 rgba(255,255,255,.1),2px 3px 4px rgba(0,0,0,.5)}
.bk.down{background:linear-gradient(180deg,#242829,#0a0b0c);height:117px}
.vocrow{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:10px;display:flex;gap:28px;align-items:stretch}
.vocrow>.voc{flex:1 1 0;min-width:0}
.vocrow>.grow{flex:0 0 280px}
.sec.voc .row{justify-content:flex-start;gap:20px;align-items:center}
.barblk{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.barcap{font:600 10px/1 var(--f-label);letter-spacing:.14em}
.steps.vb{margin-left:0;height:64px;min-width:0;flex:none}
.nums{display:flex;gap:2px}
.nums span{flex:1;text-align:center;font:500 8px/1 var(--f-label);color:#d3ebe5}
.st.cur{outline:1px solid var(--led);outline-offset:0}
.steps.pan .st::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.25)}
</style>

<header class="top">
  <a class="back" href="index.html">&larr; SYNTHESIZER</a>
  <h1>MS2000風シンセ</h1>
  <p class="sub">最初にどこかをクリックすると音が出る状態になります。つまみは上下にドラッグ、ダブルクリックで初期値に戻ります。鍵盤はクリックのほか、パソコンのキーボード(Z〜M、Q〜P)や、MIDIキーボード・DAWからも弾けます。</p>
  <div class="midi" id="midibar">
    <button type="button" class="mbtn" id="midibtn">MIDI接続</button>
    <label for="midiin">入力<select id="midiin"><option value="all">すべての入力</option></select></label>
    <label for="midich">チャンネル<select id="midich"></select></label>
    <span><i class="mled" id="midiled"></i> <span class="mstat" id="midistat">未接続</span></span>
  </div>
</header>

<div class="scroller" id="scroller">
  <div class="sizer" id="sizer">
    <div class="stage" id="stage">
      <div class="synth">
        <div class="wood"></div>
        <div class="main">
          <div class="panel">
            <div class="col" id="left"></div>
            <div class="col" id="mid"></div>
            <div class="col" id="right"></div>
          </div>
          <div class="deck">
            <div class="deck-l">
              <div class="oct">
                <div class="row2">
                  <div class="bctl"><div class="bt"><i class="led" id="octd"></i><button type="button" class="cap" id="octdb" aria-label="オクターブ下げる"></button></div></div>
                  <div class="bctl"><div class="bt"><i class="led" id="octu"></i><button type="button" class="cap" id="octub" aria-label="オクターブ上げる"></button></div></div>
                </div>
                <div class="dl">OCTAVE<br>SHIFT</div>
              </div>
              <div class="wcol"><div class="wh" id="whp"><div class="rg"></div><div class="mk"></div></div><div class="dl">PITCH<br>BEND</div></div>
              <div class="wcol"><div class="wh" id="whm"><div class="rg"></div></div><div class="dl">MOD</div></div>
            </div>
            <div class="keys" id="keys" aria-label="鍵盤 44鍵"></div>
          </div>
        </div>
        <div class="wood"></div>
      </div>
    </div>
  </div>
</div>
<p class="foot">鍵盤は44鍵(F2〜C6)。パネルは横幅1700pxの固定で、画面が狭いときは横にスクロールします。</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="kb" cx="34%" cy="28%" r="85%">
    <stop offset="0" stop-color="#5d6366"/><stop offset=".45" stop-color="#1e2123"/><stop offset="1" stop-color="#08090a"/>
  </radialGradient>
</defs></svg>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const ANG0 = -135, ANG1 = 135;
const P = (c, r, a) => { const t = a * Math.PI / 180; return [c + r * Math.sin(t), c - r * Math.cos(t)]; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const C = {}, V = {};
const scale = 1;

/* ---------- control definitions ---------- */
const K = (id, label, o = {}) => ({ t: 'k', id, label, min: 0, max: 127, def: 64, ...o });
const S = (id, label, labels, o = {}) => ({ t: 's', id, label, labels, def: 0, R: 26, ...o });
const B = (id, label, o = {}) => ({ t: 'b', id, label, def: false, ...o });
const sg = v => (v > 0 ? '+' : '') + v;
const pan = v => v < 64 ? 'L' + (64 - v) : v === 64 ? 'CNT' : 'R' + (v - 64);

const ctl = (d, sname) => { d.sec = sname; C[d.id] = d; V[d.id] = d.def; return `<div class="ctl" data-id="${d.id}"></div>`; };
const item = (x, sname) => x.stack ? `<div class="stack">${x.stack.map(b => ctl(b, sname)).join('')}</div>` : ctl(x, sname);
const sec = (title, items, cls = '') =>
  `<section class="sec ${cls}"><h3>${title}</h3><div class="row">${items.map(x => item(x, title)).join('')}</div></section>`;

/* ---------- program names / LCD ---------- */
const NAMES = ['Init Prog','Dance Lead','Analog Bs','Fat Pad','Pluck Seq','Brass Hit','Strings','Sync Lead',
  'Vocoder 1','Arp Rise','Noise FX','Glass Bell','Organ Mix','Sweep Pad','Acid Line','Poly Synth'];
const progTxt = i => `${'ABCDEFGH'[i >> 4]}.${String((i & 15) + 1).padStart(2, '0')} ${NAMES[i & 15]}`;

/* ---------- build panel ---------- */
const SRC = ['EG1','EG2','LFO1','LFO2','VELOCITY','P.BEND','MOD WHL','KEY TRK'];
const DST = ['PITCH','OSC2 PCH','OSC1 CT1','NOISE','CUTOFF','AMP','PAN','LFO2 FRQ'];
const vp = () => {
  let h = '<section class="sec vp"><h3>VIRTUAL PATCH</h3><div class="vph"><i></i><span>SOURCE</span><span>DESTINATION</span><span>INTENSITY</span></div><div class="row" style="flex-direction:column">';
  const dd = [4, 0, 5, 6];
  for (let i = 1; i <= 4; i++) {
    h += `<div class="vpr"><b>${i}</b>`
      + ctl(S('vs' + i, '', SRC, { plain: 1, ro: 1, small: 1, def: i - 1, lcd: `VP${i} SOURCE` }), 'VIRTUAL PATCH')
      + ctl(S('vd' + i, '', DST, { plain: 1, ro: 1, small: 1, def: dd[i - 1], lcd: `VP${i} DEST` }), 'VIRTUAL PATCH')
      + ctl(K('vi' + i, '', { min: -63, max: 63, def: 0, small: 1, ro: 1, fmt: sg, lcd: `VP${i} INTENSITY` }), 'VIRTUAL PATCH')
      + '</div>';
  }
  return h + '</div></section>';
};
const seq = () => `<section class="sec grow"><h3>MOD SEQUENCE</h3><div class="row seqrow">
  <div class="stack">${ctl(B('msq', 'ON/OFF'), 'MOD SEQ')}${ctl(B('msk', 'KEY SYNC'), 'MOD SEQ')}</div>
  <div class="steps" id="steps">${'<span class="st"><i></i></span>'.repeat(16)}</div></div></section>`;

$('#left').innerHTML = `
  <div class="brand"><div class="wm">Yu_My</div><div class="wm-sub">ANALOG MODELING SYNTHESIZER</div></div>
  <div class="lcd" id="lcd" aria-live="polite"></div>
  ${sec('MASTER', [
    K('vol', 'VOLUME', { def: 100 }), K('ai1', 'AUDIO IN 1', { def: 80 }), K('ai2', 'AUDIO IN 2', { def: 0 }),
    K('prog', 'PROGRAM', { def: 11, int: 1 })])}
  <div class="brow">${[
    B('t1', 'TIMBRE 1', { def: true, radio: 'tb' }), B('t2', 'TIMBRE 2', { radio: 'tb' }),
    B('shift', 'SHIFT', { mom: 1 }), B('write', 'WRITE', { mom: 1 })].map(b => ctl(b, 'PANEL')).join('')}</div>
  ${vp()}`;

$('#mid').innerHTML = `
  <div class="srow">
    ${sec('OSC 1', [S('o1w', 'WAVE', ['SAW','PULSE','TRI','SIN','VOX','DWGS','NOISE','AUDIO IN'], { R: 33 }),
      K('o1c1', 'CTRL 1', { def: 0 }), K('o1c2', 'CTRL 2', { def: 0 }), K('dwgs', 'DWGS', { min: 1, max: 64, def: 1, int: 1 })])}
    ${sec('OSC 2', [S('o2w', 'WAVE', ['SAW','SQR','TRI']), S('o2m', 'MOD SELECT', ['OFF','RING','SYNC','R+S']),
      K('o2s', 'SEMITONE', { min: -24, max: 24, def: 0, int: 1, fmt: sg }), K('o2t', 'TUNE', { min: -63, max: 63, def: 0, fmt: sg })])}
    ${sec('MIXER', [K('mx1', 'OSC 1', { def: 127 }), K('mx2', 'OSC 2', { def: 0 }), K('mxn', 'NOISE', { def: 0 })])}
  </div>
  <div class="srow">
    ${sec('FILTER', [S('ft', 'TYPE', ['24 LPF','12 LPF','BPF','HPF']), K('cut', 'CUTOFF', { def: 90 }), K('res', 'RESO', { def: 20 }),
      K('f1', 'EG1 INT', { min: -63, max: 63, def: 0, fmt: sg }), K('fv', 'VELO', { min: -63, max: 63, def: 0, fmt: sg }),
      K('fk', 'KBD TRK', { min: -63, max: 63, def: 0, fmt: sg })])}
    ${sec('AMP', [K('al', 'LEVEL', { def: 110 }), K('ap', 'PAN', { def: 64, fmt: pan }), B('dist', 'DIST'),
      K('ak', 'KBD TRK', { min: -63, max: 63, def: 0, fmt: sg })])}
    ${sec('EG 1', [K('e1a', 'ATTACK', { def: 5 }), K('e1d', 'DECAY', { def: 60 }), K('e1s', 'SUSTAIN', { def: 90 }), K('e1r', 'RELEASE', { def: 40 })])}
  </div>
  <div class="srow">
    ${sec('EG 2', [K('e2a', 'ATTACK', { def: 0 }), K('e2d', 'DECAY', { def: 50 }), K('e2s', 'SUSTAIN', { def: 127 }), K('e2r', 'RELEASE', { def: 30 })])}
    ${sec('LFO 1', [S('l1w', 'WAVE', ['SAW','SQR','TRI','S&H'], { def: 2 }), K('l1f', 'FREQ', { def: 70 }),
      { stack: [B('l1k', 'KEY SYNC'), B('l1t', 'TEMPO SYNC')] }])}
    ${sec('LFO 2', [S('l2w', 'WAVE', ['SAW','SQR+','SIN','S&H'], { def: 2 }), K('l2f', 'FREQ', { def: 40 }),
      { stack: [B('l2k', 'KEY SYNC')] }])}
  </div>`;

$('#right').innerHTML = `
  <div class="srow">
    ${sec('MOD FX', [S('mft', 'TYPE', ['CHO/FLG','ENS','PHASER'], { R: 22 }), K('mfs', 'SPEED', { size: 44 }), K('mfd', 'DEPTH', { size: 44, def: 0 })])}
    ${sec('DELAY FX', [S('dt', 'TYPE', ['STEREO','CROSS','L/R'], { R: 22 }), K('dtm', 'TIME', { size: 44 }), K('ddp', 'DEPTH', { size: 44, def: 0 })])}
  </div>
  <div class="srow">
    ${sec('PITCH', [K('ptn', 'TUNE', { min: -50, max: 50, def: 0, fmt: sg }), K('pbr', 'BEND RANGE', { min: -12, max: 12, def: 2, int: 1, fmt: sg }),
      K('ptr', 'TRANSP', { min: -24, max: 24, def: 0, int: 1, fmt: sg }), K('pvi', 'VIB INT', { min: -63, max: 63, def: 0, fmt: sg }),
      K('ppo', 'PORTA', { def: 0 })])}
  </div>
  <div class="srow">

    for (const k in V) { const t = typeof V[k]; if (t === 'number' || t === 'boolean') pushNow(k); }
    updMod(); updDelay();
    N.voc.bands.forEach((b, i) => { b.lv.gain.value = vLev[i] / 127 * 1.4; b.pn.pan.value = (vPan[i] - 64) / 64; });
    await ctx.resume();
    setSource();
  })().catch(e => { console.error(e); flash('AUDIO ERROR', 'See console'); });
  return initP;
}
const A = fn => {
  if (ctx && ctx.state === 'suspended') ctx.resume();
  if (eng) fn(); else ensureAudio().then(() => { if (eng) fn(); });
};
const playOn = (m, vel) => A(() => eng.on(m, vel / 127));
const playOff = m => A(() => eng.off(m));

/* ================= mod sequence, arpeggiator, clock ================= */
const seqV = [64, 96, 40, 112, 64, 24, 100, 72, 50, 120, 36, 88, 64, 104, 28, 80];
const seqBars = makeBars($('#steps'), seqV, () => {}, 'MOD SEQ STEP');
const vocBandSet = i => {
  const b = N && N.voc.bands[i]; if (!b) return;
  b.lv.gain.setTargetAtTime(vLev[i] / 127 * 1.4, ctx.currentTime, 0.02);
  b.pn.pan.setTargetAtTime((vPan[i] - 64) / 64, ctx.currentTime, 0.02);
};
makeBars($('#vlev'), vLev, i => vocBandSet(i), 'VOC CH LEVEL');
makeBars($('#vpan'), vPan, i => vocBandSet(i), 'VOC CH PAN');

const phys = new Map();
let sus = false;
const sustained = new Set();
let oct = 0, arpHeld = [], arpCur = [], arpOffT = null, arpIdx = 0, arpVel = 100;
let clk = null, clkNext = 0, seqIdx = 0;

function arpStop() {
  clearTimeout(arpOffT);
  arpCur.forEach(playOff); arpCur = []; arpIdx = 0;
}
function arpStep(stepMs) {
  clearTimeout(arpOffT);
  arpCur.forEach(playOff); arpCur = [];
  if (!V.arpon || !arpHeld.length) { arpIdx = 0; return; }
  const sorted = [...arpHeld].sort((a, b) => a - b);
  const rng = Math.max(1, V.arpr | 0), type = V.arpt | 0;
  const pool = [];
  for (let r = 0; r < rng; r++) sorted.forEach(n => { if (n + 12 * r <= 127) pool.push(n + 12 * r); });
  let notes;
  if (type === 5) notes = sorted;
  else {
    const n = pool.length;
    let i;
    if (type === 0) { i = arpIdx % n; arpIdx++; }
    else if (type === 1) { i = (n - 1) - (arpIdx % n); arpIdx++; }
    else if (type === 2 || type === 3) {
      const seq = type === 2 ? Math.max(1, n * 2 - 2) : n * 2, k = arpIdx % seq;
      i = k < n ? k : (type === 2 ? seq - k : seq - 1 - k); arpIdx++;
    } else i = Math.floor(Math.random() * n);
    notes = [pool[i]];
  }
  notes.forEach(n => playOn(n, arpVel));
  arpCur = notes;
  const gate = stepMs * (0.1 + 0.88 * V.arpg / 127);
  arpOffT = setTimeout(() => { arpCur.forEach(playOff); arpCur = []; }, gate);
}
function seqStep() {
  seqBars.spans.forEach((s, i) => s.classList.toggle('cur', !!V.msq && i === seqIdx));
  if (!V.msq) return;
  V.seqv = seqV[seqIdx]; changed('seqv');
  seqIdx = (seqIdx + 1) % 16;
}
const clockWanted = () => (V.arpon && arpHeld.length > 0) || V.msq;
function clockTick() {
  const step = 15000 / V.arptm;
  arpStep(step); seqStep();
  if (!clockWanted()) { clk = null; arpStop(); return; }
  clkNext += step;
  clk = setTimeout(clockTick, Math.max(0, clkNext - performance.now()));
}
function clockStart() {
  if (clk !== null) return;
  clkNext = performance.now(); clk = setTimeout(clockTick, 0);
}

function changed(id) {
  if (eng) pushNow(id);
  if (id === 'arpon') {
    if (!V.arpon) { arpStop(); arpHeld = []; phys.forEach(o => playOn(o.m, 100)); }
    else { phys.forEach(o => { playOff(o.m); if (!arpHeld.includes(o.m)) arpHeld.push(o.m); }); if (arpHeld.length) clockStart(); }
  }
  if (id === 'msq' && V.msq) clockStart();
  if (id === 'arplt' && !V.arplt && phys.size === 0) arpHeld = [];
}

/* ================= keyboard (44 keys, F2 to C6) ================= */
const keys = $('#keys');
const NN = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = m => NN[m % 12] + (Math.floor(m / 12) - 1);
const keyEl = {};
let wi = 0;
for (let i = 0; i < 44; i++) {
  const m = 41 + i, black = [1, 3, 6, 8, 10].includes(m % 12);
  const k = document.createElement('div');
  if (!black) { k.className = 'wk'; k.style.left = (wi * 53) + 'px'; wi++; }
  else { k.className = 'bk'; k.style.left = (wi * 53 - 16) + 'px'; }
  k.dataset.m = m; k.title = noteName(m);
  keys.appendChild(k); keyEl[m] = k;
}
const hilite = (m, on) => { const e = keyEl[m]; if (e) e.classList.toggle('down', on); };

function noteOn(id, base, vel = 100, useOct = true) {
  if (phys.has(id)) return;
  const m = cl(base + (useOct ? oct * 12 : 0), 0, 127);
  sustained.delete(m);
  const wasEmpty = phys.size === 0;
  phys.set(id, { m, base });
  hilite(base, true);
  if (V.arpon) {
    if (V.arplt && wasEmpty) arpHeld = [];
    if (!arpHeld.includes(m)) arpHeld.push(m);
    arpVel = vel; clockStart();
  } else playOn(m, vel);
  if (V.msq && V.msk && wasEmpty) seqIdx = 0;
}
function noteOff(id) {
  const o = phys.get(id);
  if (!o) return;
  phys.delete(id); hilite(o.base, false);
  if (V.arpon) { if (!V.arplt && !sus) arpHeld = arpHeld.filter(x => x !== o.m); }
  else if (sus) sustained.add(o.m);
  else playOff(o.m);
}
const isHeld = m => [...phys.values()].some(o => o.m === m);
function pedal(on) {
  if (on === sus) return;
  sus = on;
  if (on) return;
  sustained.forEach(m => { if (!isHeld(m)) playOff(m); });
  sustained.clear();
  if (V.arpon && !V.arplt) arpHeld = arpHeld.filter(isHeld);
}
function allNotesOff() {
  [...phys.keys()].forEach(noteOff);
  sus = false; sustained.clear(); arpHeld = []; arpStop();
  if (eng) eng.panic();
}
keys.addEventListener('pointerdown', e => {
  const k = e.target.closest('[data-m]'); if (!k) return;
  e.preventDefault();
  const r = k.getBoundingClientRect();
  const vel = Math.round(40 + 87 * cl((e.clientY - r.top) / r.height, 0, 1));
  noteOn('p' + e.pointerId, +k.dataset.m, vel);
  flash('NOTE ' + noteName(+k.dataset.m), 'Velocity ' + vel);
});
const ptrUp = e => noteOff('p' + e.pointerId);
window.addEventListener('pointerup', ptrUp); window.addEventListener('pointercancel', ptrUp);

const PCK = {
  KeyZ: 0, KeyS: 1, KeyX: 2, KeyD: 3, KeyC: 4, KeyV: 5, KeyG: 6, KeyB: 7, KeyH: 8, KeyN: 9, KeyJ: 10, KeyM: 11,
  Comma: 12, KeyL: 13, Period: 14, Semicolon: 15, Slash: 16,
  KeyQ: 12, Digit2: 13, KeyW: 14, Digit3: 15, KeyE: 16, KeyR: 17, Digit5: 18, KeyT: 19, Digit6: 20, KeyY: 21, Digit7: 22,
  KeyU: 23, KeyI: 24, Digit9: 25, KeyO: 26, Digit0: 27, KeyP: 28
};
window.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const o = PCK[e.code];
  if (o === undefined) return;
  e.preventDefault();
  noteOn('k' + e.code, 48 + o, 100);
});
window.addEventListener('keyup', e => { if (PCK[e.code] !== undefined) noteOff('k' + e.code); });
window.addEventListener('blur', () => { [...phys.keys()].filter(k => k[0] !== 'm').forEach(noteOff); });

/* ================= wheels and octave ================= */
function wheel(node, name, init, spring, fmt, cb) {
  const rg = node.querySelector('.rg');
  let v = init, y0 = 0, v0 = 0, on = false, raf = 0;
  const paint = () => { rg.style.backgroundPosition = `0 ${Math.round(-v * 280)}px`; };
  paint();
  node.addEventListener('pointerdown', e => { cancelAnimationFrame(raf); on = true; y0 = e.clientY; v0 = v; node.setPointerCapture(e.pointerId); e.preventDefault(); });
  node.addEventListener('pointermove', e => {
    if (!on) return;
    v = cl(v0 + (y0 - e.clientY) / scale / 130, 0, 1);
    paint(); cb(v); flash(name, fmt(v));
  });
  const end = () => {
    if (!on) return; on = false;
    if (spring) {
      const step = () => { v += (0.5 - v) * 0.28; if (Math.abs(v - 0.5) < 0.003) v = 0.5; paint(); cb(v); if (v !== 0.5) raf = requestAnimationFrame(step); };
      step();
    }
  };
  node.addEventListener('pointerup', end); node.addEventListener('pointercancel', end);
  return { set(x) { cancelAnimationFrame(raf); on = false; v = x; paint(); } };
}
const wheelP = wheel($('#whp'), 'PITCH BEND', 0.5, true, v => sg(Math.round((v - 0.5) * 254)), v => { V.bend = (v - 0.5) * 2; changed('bend'); });
const wheelM = wheel($('#whm'), 'MOD WHEEL', 0, false, v => String(Math.round(v * 127)), v => { V.mod = v; changed('mod'); });

/* ================= MIDI input (Web MIDI) ================= */
const midi = { access: null, ch: 0 };
const mSel = $('#midiin'), mCh = $('#midich'), mBtn = $('#midibtn'), mStat = $('#midistat'), mLed = $('#midiled');
mCh.innerHTML = '<option value="0">全チャンネル (OMNI)</option>' + Array.from({ length: 16 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
};
let ledT = 0;
const blink = () => { mLed.classList.add('on'); clearTimeout(ledT); ledT = setTimeout(() => mLed.classList.remove('on'), 90); };
function bendExt(raw) {
  const b = cl((raw - 8192) / 8192, -1, 1);
  V.bend = b; changed('bend'); wheelP.set((b + 1) / 2);
}
function modExt(x) { V.mod = x; changed('mod'); wheelM.set(x); }
function onMidi(e) {
  const d = e.data;
  if (!d || d.length < 1 || d[0] >= 0xF0) return;
  const ch = (d[0] & 15) + 1, type = d[0] & 0xF0, a = d[1] | 0, b = d[2] | 0;
  if (midi.ch && ch !== midi.ch) return;
  blink();
  if (!ctx || ctx.state !== 'running') mStat.textContent = '音を出すには、画面を1回クリックしてください';
  if (type === 0x90 && b > 0) noteOn('m' + ch + ':' + a, a, b, false);
  else if (type === 0x80 || type === 0x90) noteOff('m' + ch + ':' + a);
  else if (type === 0xE0) bendExt((b << 7) | a);
  else if (type === 0xB0) {
    if (a === 1) modExt(b / 127);
    else if (a === 64) pedal(b >= 64);
    else if (a === 120 || a === 123) allNotesOff();
  }
}
function bindInputs() {
  if (!midi.access) return;
  const ins = [...midi.access.inputs.values()];
  const want = mSel.value && mSel.value !== 'all' ? mSel.value : (store.get('ms2000.midiin') || 'all');
  mSel.textContent = '';
  const add = (val, label) => { const o = document.createElement('option'); o.value = val; o.textContent = label; mSel.appendChild(o); };
  add('all', 'すべての入力');
  ins.forEach(i => add(i.id, i.name || i.id));
  mSel.value = ins.some(i => i.id === want) ? want : 'all';
  ins.forEach(i => { i.onmidimessage = (mSel.value === 'all' || mSel.value === i.id) ? onMidi : null; });
  mStat.textContent = ins.length ? `入力 ${ins.length} 台 接続中` : '入力機器が見つかりません';
}
async function midiConnect() {
  if (!navigator.requestMIDIAccess) { mStat.textContent = 'このブラウザはMIDIに未対応です(Chrome / Edge を使ってください)'; return; }
  try {
    midi.access = await navigator.requestMIDIAccess({ sysex: false });
    midi.access.onstatechange = bindInputs;
    bindInputs();
    mBtn.textContent = 'MIDI接続済み'; mBtn.classList.add('on');
    store.set('ms2000.midi', '1');
  } catch (err) {
    mStat.textContent = 'MIDIを使えません(許可されていないか、この表示では未対応です)';
  }
}
mBtn.addEventListener('click', midiConnect);
mSel.addEventListener('change', () => { store.set('ms2000.midiin', mSel.value); bindInputs(); });
mCh.addEventListener('change', () => { midi.ch = +mCh.value; store.set('ms2000.midich', mCh.value); });
{
  const c = store.get('ms2000.midich');
  if (c !== null && c !== '') { mCh.value = c; midi.ch = +mCh.value || 0; }
  if (store.get('ms2000.midi') === '1' && navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'midi' }).then(p => { if (p.state === 'granted') midiConnect(); }).catch(() => { /* not supported */ });
  }
}

const octLed = () => { $('#octd').classList.toggle('on', oct < 0); $('#octu').classList.toggle('on', oct > 0); };
$('#octdb').addEventListener('click', () => { oct = Math.max(-2, oct - 1); octLed(); flash('OCTAVE SHIFT', sg(oct)); });
$('#octub').addEventListener('click', () => { oct = Math.min(2, oct + 1); octLed(); flash('OCTAVE SHIFT', sg(oct)); });

/* the first click or key press starts the audio engine */
document.addEventListener('pointerdown', () => ensureAudio(), { once: true });

})();
</script>
