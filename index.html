<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yu_My_Love Tool Box</title>
<style>
  :root{
    --bg: #05070d;
    --ink: #eef1f8;
    --ink-dim: #6f7a90;
    --line: #202839;
    --c1: #ff2ea6; /* magenta */
    --c2: #2ee6ff; /* cyan */
    --c3: #b26bff; /* purple (games) */
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px) 0 0 / 100% 42px,
      radial-gradient(1200px 700px at 50% -10%, #131a2b 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: 'Courier New', Consolas, monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 60px 20px 40px;
    overflow-x:hidden;
  }

  .glow-line{
    position:fixed;
    top:0; left:0; right:0;
    height:2px;
    background: linear-gradient(90deg, transparent, var(--c2), var(--c1), transparent);
    opacity:0.6;
    animation: sweep 6s linear infinite;
  }
  @keyframes sweep{
    0%{ transform: translateX(-30%); }
    100%{ transform: translateX(30%); }
  }

  h1{
    font-size: clamp(26px, 6vw, 48px);
    letter-spacing: 3px;
    margin: 0 0 6px;
    text-align:center;
    background: linear-gradient(90deg, var(--c1), var(--c2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 50px rgba(255,255,255,0.06);
  }
  .subtitle{
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 56px;
    text-align:center;
  }

  .nav-grid{
    width: 100%;
    max-width: 980px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 760px){
    .nav-grid{ grid-template-columns: 1fr; max-width: 420px; }
  }

  .card{
    position: relative;
    display:block;
    text-decoration:none;
    color: inherit;
    background: linear-gradient(180deg, #10141f, #0a0d16);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 34px 22px 28px;
    text-align:center;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card:hover{
    transform: translateY(-4px);
    border-color: var(--card-color);
    box-shadow: 0 10px 40px -10px var(--card-glow), inset 0 0 0 1px var(--card-color);
  }
  .card .icon{
    width: 56px; height:56px;
    margin: 0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    color: var(--card-color);
    filter: drop-shadow(0 0 10px var(--card-glow));
  }
  .card .icon svg{ width:100%; height:100%; }
  .card .label{
    font-size: 16px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    color: var(--ink);
  }
  .card .desc{
    font-size: 11px;
    line-height: 1.7;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }
  .card .tag{
    display:inline-block;
    margin-top: 14px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--card-color);
    border: 1px solid var(--card-color);
    border-radius: 20px;
    padding: 3px 12px;
    opacity: 0.85;
  }

  #card-signal{ --card-color: var(--c2); --card-glow: rgba(46,230,255,0.35); }
  #card-tools{ --card-color: var(--c1); --card-glow: rgba(255,46,166,0.35); }
  #card-games{ --card-color: var(--c3); --card-glow: rgba(178,107,255,0.35); }

  footer{
    margin-top: 60px;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 2px;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="glow-line"></div>

  <h1>Yu_My_Love Tool Box</h1>
  <div class="subtitle">Select a Module</div>

  <div class="nav-grid">
    <a class="card" id="card-signal" href="./signalrack/index.html">
      <div class="icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="10" width="4" height="28" rx="1" fill="currentColor"/>
          <rect x="14" y="4" width="4" height="34" rx="1" fill="currentColor"/>
          <rect x="22" y="16" width="4" height="22" rx="1" fill="currentColor"/>
          <rect x="30" y="8" width="4" height="30" rx="1" fill="currentColor"/>
          <rect x="38" y="20" width="4" height="18" rx="1" fill="currentColor"/>
        </svg>
      </div>
      <div class="label">SIGNAL RACK</div>
      <div class="desc">マルチトラック再生 &amp; サウンドFX<br>(ピッチ / ディレイ / EQ / マスタリング)</div>
      <span class="tag">AUDIO</span>
    </a>

    <a class="card" id="card-tools" href="./tools/index.html">
      <div class="icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 38 L14 27 L31 10 C32.5 8.5 35 8.5 36.5 10 L38 11.5 C39.5 13 39.5 15.5 38 17 L21 34 L10 38 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M27 14 L34 21" stroke="currentColor" stroke-width="2.5"/>
          <path d="M10 38 L14 34" stroke="currentColor" stroke-width="2.5"/>
        </svg>
      </div>
      <div class="label">TOOLS</div>
      <div class="desc">プロンプト支援や映像制作など<br>制作をサポートするツール置き場</div>
      <span class="tag">MAKE</span>
    </a>

    <a class="card" id="card-games" href="./games/index.html">
      <div class="icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="16" width="40" height="20" rx="10" stroke="currentColor" stroke-width="2.5"/>
          <path d="M14 22 V30 M10 26 H18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="32" cy="23" r="2" fill="currentColor"/>
          <circle cx="37" cy="28" r="2" fill="currentColor"/>
        </svg>
      </div>
      <div class="label">GAMES</div>
      <div class="desc">MP3 Barcode Battle など<br>音を素材にしたゲーム集</div>
      <span class="tag">PLAY</span>
    </a>
  </div>

  <footer>YU_MY_LOVE TOOL BOX &mdash; ROOT SYSTEM</footer>
</body>
</html>
