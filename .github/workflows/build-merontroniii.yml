name: Build MeronTronIII (macOS VST3 + AU + Standalone)

on:
  workflow_dispatch:
  push:
    paths: ['vst/merontroniii/**', '.github/workflows/build-merontroniii.yml']

defaults:
  run:
    working-directory: vst/merontroniii
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The sound font (115 MB) is too large for the git repo, so it is
      # kept as a release asset and fetched here, before CMake's
      # post-build copy steps place it inside the bundles.
      - name: Fetch sound font from release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download merontroniii-font-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'MeronTronIII.sf2' --dir .
          ls -l MeronTronIII.sf2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build VST3, AU and Standalone
        run: cmake --build build --config Release --target MeronTronIII_VST3 MeronTronIII_AU MeronTronIII_Standalone --parallel

      # Ad-hoc signed (not notarized): the tester must clear the quarantine
      # flag after installing — see TESTER-MAC.md, which ships inside the zip.
      - name: Sign and package
        run: |
          VST3="build/MeronTronIII_artefacts/Release/VST3/MeronTronIII.vst3"
          AU="build/MeronTronIII_artefacts/Release/AU/MeronTronIII.component"
          APP="build/MeronTronIII_artefacts/Release/Standalone/MeronTronIII.app"
          test -d "$VST3" && test -d "$AU" && test -d "$APP"
          test -f "$VST3/Contents/Resources/MeronTronIII.sf2"
          test -f "$AU/Contents/Resources/MeronTronIII.sf2"
          test -f "$APP/Contents/MacOS/MeronTronIII.sf2"
          for B in "$VST3" "$AU" "$APP"; do
            chmod -R u+rwX,go+rX "$B"
            codesign --force --deep --sign - "$B"
            codesign --verify --deep --strict --verbose=2 "$B"
          done
          # NOTE: grep -iE "minos|version" — plain "minos" does not match the
          # x86_64 slice's LC_VERSION_MIN_MACOSX output (that bug broke the
          # Kithara workflow once). "|| true" keeps the check informational.
          echo "min OS (app):";  vtool -show-build "$APP/Contents/MacOS/MeronTronIII" | grep -iE "minos|version" || true
          echo "min OS (vst3):"; vtool -show-build "$VST3/Contents/MacOS/MeronTronIII" | grep -iE "minos|version" || true
          echo "min OS (au):";   vtool -show-build "$AU/Contents/MacOS/MeronTronIII" | grep -iE "minos|version" || true
          echo "vst3 architectures: $(lipo -archs "$VST3/Contents/MacOS/MeronTronIII")"
          echo "au architectures:   $(lipo -archs "$AU/Contents/MacOS/MeronTronIII")"
          echo "app architectures:  $(lipo -archs "$APP/Contents/MacOS/MeronTronIII")"
          mkdir -p dist package
          cp -R "$VST3" package/
          cp -R "$AU" package/
          cp -R "$APP" package/
          cp TESTER-MAC.md package/
          (cd package && ditto -c -k . "../dist/MeronTronIII-1.0.3-macOS.zip")
          ls -l dist

      # Validate the AU the way Logic Pro will: install it into the user
      # Components folder and run Apple's auval. A validation failure here
      # must not be hidden, but an auval that cannot run at all on the
      # runner is reported, not faked — this step never fails the job.
      - name: Validate AU with auval
        run: |
          AU="build/MeronTronIII_artefacts/Release/AU/MeronTronIII.component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "$AU" "$HOME/Library/Audio/Plug-Ins/Components/"
          set +e
          auval -v aumu Mrn3 YMmg > auval.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "auval first attempt failed (rc=$RC); refreshing the AU registrar and retrying once"
            killall -9 AudioComponentRegistrar 2>/dev/null
            sleep 5
            auval -v aumu Mrn3 YMmg > auval.log 2>&1
            RC=$?
          fi
          set -e
          cat auval.log
          if [ $RC -eq 0 ] && grep -q "AU VALIDATION SUCCEEDED" auval.log; then
            echo "AUVAL_RESULT: PASS"
          else
            echo "AUVAL_RESULT: FAIL (auval rc=$RC — see log above)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MeronTronIII-1.0.3-macOS
          path: vst/merontroniii/dist/MeronTronIII-1.0.3-macOS.zip
