name: Build YM-Kithara (macOS app)

on:
  workflow_dispatch:
  push:
    paths: ['daw/ym-kithara/**', '.github/workflows/build-ym-kithara.yml']

defaults:
  run:
    working-directory: daw/ym-kithara
    shell: bash

# FFmpeg comes from Homebrew, whose bottles are single-arch. Both slices
# are built on one Apple Silicon runner: the arm64 slice against the
# native /opt/homebrew FFmpeg, the x86_64 slice against an Intel
# Homebrew installed under Rosetta in /usr/local (bottles pour quickly;
# the macos-15-intel runner's own brew install proved far too slow).
# Each slice gets its FFmpeg dylibs bundled into Contents/Frameworks,
# then the universal .app is assembled with lipo.
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and tools (Apple Silicon)
        run: brew install ffmpeg pkg-config dylibbundler

      - name: Build arm64 slice
        run: |
          cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64"
          cmake --build build-arm64 --config Release --parallel
          APP="build-arm64/YMKithara_artefacts/Release/YM-Kithara.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/KitharaVstScanner"
          echo "scanner: $(lipo -archs "$APP/Contents/MacOS/KitharaVstScanner")"
          mkdir -p "$APP/Contents/Frameworks"
          dylibbundler -cd -of -b -x "$APP/Contents/MacOS/YM-Kithara" \
                       -d "$APP/Contents/Frameworks" \
                       -p @executable_path/../Frameworks/
          if otool -L "$APP/Contents/MacOS/YM-Kithara" | grep -E "/opt/homebrew|/usr/local/"; then
            echo "ERROR: Homebrew paths remain in the arm64 binary"; exit 1
          fi
          mkdir -p slices
          cp -R "$APP" "slices/YM-Kithara-arm64.app"
          ls -1 "slices/YM-Kithara-arm64.app/Contents/Frameworks"

      - name: Install Intel Homebrew and FFmpeg (Rosetta)
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          if [ ! -x /usr/local/bin/brew ]; then
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew install ffmpeg
          /usr/local/bin/pkg-config --modversion libavformat

      - name: Build x86_64 slice
        run: |
          PKG_CONFIG_PATH="/usr/local/lib/pkgconfig" \
          cmake -S . -B build-x86_64 -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="x86_64" \
                -DPKG_CONFIG_EXECUTABLE=/usr/local/bin/pkg-config
          cmake --build build-x86_64 --config Release --parallel
          APP="build-x86_64/YMKithara_artefacts/Release/YM-Kithara.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/KitharaVstScanner"
          echo "scanner: $(lipo -archs "$APP/Contents/MacOS/KitharaVstScanner")"
          mkdir -p "$APP/Contents/Frameworks"
          dylibbundler -cd -of -b -x "$APP/Contents/MacOS/YM-Kithara" \
                       -d "$APP/Contents/Frameworks" \
                       -p @executable_path/../Frameworks/
          if otool -L "$APP/Contents/MacOS/YM-Kithara" | grep -E "/opt/homebrew|/usr/local/"; then
            echo "ERROR: Homebrew paths remain in the x86_64 binary"; exit 1
          fi
          cp -R "$APP" "slices/YM-Kithara-x86_64.app"
          ls -1 "slices/YM-Kithara-x86_64.app/Contents/Frameworks"

      # The scanner binary sits inside Contents/MacOS (CMake copies it
      # next to the app executable, which is where PluginManager looks).
      - name: Assemble universal app, sign and zip
        run: |
          ARM_APP="slices/YM-Kithara-arm64.app"
          X64_APP="slices/YM-Kithara-x86_64.app"
          test -d "$ARM_APP" && test -d "$X64_APP"

          rm -rf "YM-Kithara.app"
          cp -R "$ARM_APP" "YM-Kithara.app"

          # Fat versions of the two executables.
          for bin in "Contents/MacOS/YM-Kithara" "Contents/MacOS/KitharaVstScanner"; do
            lipo -create "$ARM_APP/$bin" "$X64_APP/$bin" -output "YM-Kithara.app/$bin.fat"
            mv "YM-Kithara.app/$bin.fat" "YM-Kithara.app/$bin"
            chmod +x "YM-Kithara.app/$bin"
            echo "$bin: $(lipo -archs "YM-Kithara.app/$bin")"
          done

          # Fat versions of every bundled dylib; warn on single-arch leftovers.
          mkdir -p fatfw
          for f in "YM-Kithara.app/Contents/Frameworks"/*; do
            name=$(basename "$f")
            if [ -f "$X64_APP/Contents/Frameworks/$name" ]; then
              lipo -create "$f" "$X64_APP/Contents/Frameworks/$name" -output "fatfw/$name"
              mv "fatfw/$name" "$f"
            else
              echo "WARNING: $name exists only in the arm64 slice"
            fi
          done
          for f in "$X64_APP/Contents/Frameworks"/*; do
            name=$(basename "$f")
            if [ ! -f "YM-Kithara.app/Contents/Frameworks/$name" ]; then
              echo "WARNING: $name exists only in the x86_64 slice — copying as-is"
              cp "$f" "YM-Kithara.app/Contents/Frameworks/$name"
            fi
          done

          # Every shipped binary must now be universal.
          fail=0
          for bin in "YM-Kithara.app/Contents/MacOS/YM-Kithara" \
                     "YM-Kithara.app/Contents/MacOS/KitharaVstScanner" \
                     "YM-Kithara.app/Contents/Frameworks"/*; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "ERROR: not universal: $bin"; fail=1 ;;
            esac
          done
          [ "$fail" = 0 ]

          # No dependency may point into Homebrew any more (app + dylibs).
          if otool -L "YM-Kithara.app/Contents/MacOS/YM-Kithara" \
               "YM-Kithara.app/Contents/Frameworks"/* \
               | grep -E "/opt/homebrew|/usr/local/"; then
            echo "ERROR: Homebrew paths remain"; exit 1
          fi

          # Ad-hoc signed (not notarized): the tester must clear the
          # quarantine flag after unzipping — see TESTER-MAC.md.
          chmod -R u+rwX,go+rX "YM-Kithara.app"
          codesign --force --deep --sign - "YM-Kithara.app"
          codesign --verify --deep --strict --verbose=2 "YM-Kithara.app"

          mkdir -p package dist
          cp -R "YM-Kithara.app" package/
          cp TESTER-MAC.md package/
          (cd package && ditto -c -k . "../dist/YM-Kithara-M6.10-macOS.zip")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: YM-Kithara-M6.10-macOS
          path: daw/ym-kithara/dist/YM-Kithara-M6.10-macOS.zip
