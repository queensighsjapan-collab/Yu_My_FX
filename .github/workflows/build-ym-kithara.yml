name: Build YM-Kithara (macOS app)

on:
  workflow_dispatch:
  push:
    paths: ['daw/ym-kithara/**', '.github/workflows/build-ym-kithara.yml']

defaults:
  run:
    working-directory: daw/ym-kithara
    shell: bash

env:
  # Both slices must resolve the SAME FFmpeg version (their dylibs are
  # lipo-merged), so neither leg updates Homebrew: each runner installs
  # from its image's bundled homebrew-core snapshot instead. A fresh
  # Homebrew install under Rosetta is not an alternative — current
  # Homebrew refuses to install on Intel/Rosetta outright.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   arch: arm64  }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and tools
        run: |
          brew install ffmpeg pkg-config dylibbundler
          brew list --versions ffmpeg
          pkg-config --modversion libavformat libavcodec libavutil libswscale libswresample

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"

      - name: Build app and scanner
        run: cmake --build build --config Release --parallel

      # The FFmpeg dylibs (and their Homebrew dependencies) are copied into
      # Contents/Frameworks with @executable_path-relative install names,
      # so the .app runs on machines without Homebrew. The scanner binary
      # is already inside Contents/MacOS (CMake copies it next to the app
      # executable, which is where PluginManager looks for it).
      - name: Bundle FFmpeg libraries into the app
        run: |
          APP="build/YMKithara_artefacts/Release/YM-Kithara.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/YM-Kithara"
          test -f "$APP/Contents/MacOS/KitharaVstScanner"
          echo "scanner: $(lipo -archs "$APP/Contents/MacOS/KitharaVstScanner")"
          mkdir -p "$APP/Contents/Frameworks"
          dylibbundler -cd -of -b -x "$APP/Contents/MacOS/YM-Kithara" \
                       -d "$APP/Contents/Frameworks" \
                       -p @executable_path/../Frameworks/
          echo "--- main binary dependencies ---"
          otool -L "$APP/Contents/MacOS/YM-Kithara"
          if otool -L "$APP/Contents/MacOS/YM-Kithara" | grep -E "/opt/homebrew|/usr/local/"; then
            echo "ERROR: Homebrew paths remain in the app binary"; exit 1
          fi
          echo "--- bundled frameworks ---"
          ls -1 "$APP/Contents/Frameworks"

      - uses: actions/upload-artifact@v4
        with:
          name: YM-Kithara-app-${{ matrix.arch }}
          path: daw/ym-kithara/build/YMKithara_artefacts/Release/YM-Kithara.app

  package:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: daw/ym-kithara/slices

      - name: Assemble universal app, sign and zip
        run: |
          # upload-artifact stores a directory's CONTENTS, so each slice
          # arrived as a bare Contents/ tree; locate the app roots via
          # their main binaries.
          ARM_BIN=$(find slices -type f -path "*arm64*/Contents/MacOS/YM-Kithara" | head -1)
          X64_BIN=$(find slices -type f -path "*x86_64*/Contents/MacOS/YM-Kithara" | head -1)
          test -n "$ARM_BIN" && test -n "$X64_BIN"
          ARM_APP=$(dirname "$(dirname "$(dirname "$ARM_BIN")")")
          X64_APP=$(dirname "$(dirname "$(dirname "$X64_BIN")")")
          echo "arm64 slice:  $ARM_APP"
          echo "x86_64 slice: $X64_APP"

          # Each slice must be self-contained: every @executable_path
          # reference from its binaries must exist in its Frameworks.
          for SLICE in "$ARM_APP" "$X64_APP"; do
            refs=$( { otool -L "$SLICE/Contents/MacOS/YM-Kithara";
                      otool -L "$SLICE/Contents/Frameworks"/*; } \
                    | grep -o "@executable_path/../Frameworks/[^ ]*" | sort -u )
            for ref in $refs; do
              name=$(basename "$ref")
              if [ ! -f "$SLICE/Contents/Frameworks/$name" ]; then
                echo "ERROR: $SLICE references missing dylib $name"; exit 1
              fi
            done
            echo "$SLICE: all Frameworks references resolve"
          done

          rm -rf "YM-Kithara.app"
          mkdir "YM-Kithara.app"
          cp -R "$ARM_APP/Contents" "YM-Kithara.app/Contents"

          # Fat versions of the two executables (mandatory).
          for bin in "Contents/MacOS/YM-Kithara" "Contents/MacOS/KitharaVstScanner"; do
            lipo -create "$ARM_APP/$bin" "$X64_APP/$bin" -output "YM-Kithara.app/$bin.fat"
            mv "YM-Kithara.app/$bin.fat" "YM-Kithara.app/$bin"
            chmod +x "YM-Kithara.app/$bin"
            archs=$(lipo -archs "YM-Kithara.app/$bin")
            echo "$bin: $archs"
            case "$archs" in
              *arm64*x86_64*) ;;
              *) echo "ERROR: not universal: $bin"; exit 1 ;;
            esac
          done

          # Frameworks: the two runner images carry slightly different
          # Homebrew snapshots (e.g. libavcodec .102 vs .101, OpenSSL 4
          # vs 3), so the dylib sets are not identical. Same-named files
          # are the same version for both arches -> lipo them. Files
          # whose names differ are arch-specific versions: ship BOTH —
          # each slice of the fat binaries references exactly the names
          # its own slice's dylibbundler wrote, so the union is complete
          # and every reference still resolves.
          mkdir -p fatfw
          for f in "$X64_APP/Contents/Frameworks"/*; do
            name=$(basename "$f")
            if [ -f "YM-Kithara.app/Contents/Frameworks/$name" ]; then
              lipo -create "YM-Kithara.app/Contents/Frameworks/$name" "$f" \
                   -output "fatfw/$name"
              mv "fatfw/$name" "YM-Kithara.app/Contents/Frameworks/$name"
              echo "fat: $name"
            else
              cp "$f" "YM-Kithara.app/Contents/Frameworks/$name"
              echo "x86_64-only (version skew): $name"
            fi
          done
          for f in "YM-Kithara.app/Contents/Frameworks"/*; do
            echo "$(basename "$f"): $(lipo -archs "$f")"
          done

          # The merged app must still satisfy both slices' references.
          for arch in arm64 x86_64; do
            refs=$( { otool -arch $arch -L "YM-Kithara.app/Contents/MacOS/YM-Kithara";
                      for d in "$ARM_APP/Contents/Frameworks"/* "$X64_APP/Contents/Frameworks"/*; do
                        otool -arch $arch -L "$d" 2>/dev/null;
                      done; } \
                    | grep -o "@executable_path/../Frameworks/[^ ]*" | sort -u )
            for ref in $refs; do
              name=$(basename "$ref")
              if [ ! -f "YM-Kithara.app/Contents/Frameworks/$name" ]; then
                echo "ERROR: merged app misses $name (needed by $arch)"; exit 1
              fi
            done
            echo "$arch: merged references resolve"
          done

          # No dependency may point into Homebrew any more (app + dylibs).
          if otool -L "YM-Kithara.app/Contents/MacOS/YM-Kithara" \
               "YM-Kithara.app/Contents/Frameworks"/* \
               | grep -E "/opt/homebrew|/usr/local/"; then
            echo "ERROR: Homebrew paths remain"; exit 1
          fi

          # Ad-hoc signed (not notarized): the tester must clear the
          # quarantine flag after unzipping — see TESTER-MAC.md.
          chmod -R u+rwX,go+rX "YM-Kithara.app"
          codesign --force --deep --sign - "YM-Kithara.app"
          codesign --verify --deep --strict --verbose=2 "YM-Kithara.app"

          mkdir -p package dist
          cp -R "YM-Kithara.app" package/
          cp TESTER-MAC.md package/
          (cd package && ditto -c -k . "../dist/YM-Kithara-M6.10-macOS.zip")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: YM-Kithara-M6.10-macOS
          path: daw/ym-kithara/dist/YM-Kithara-M6.10-macOS.zip
