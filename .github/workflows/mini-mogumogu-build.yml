name: Build mini mogumogu (VST3/AU)
on:
  push:
    paths: ['vst/mini-mogumogu/**', '.github/workflows/mini-mogumogu-build.yml']
  pull_request:
    paths: ['vst/mini-mogumogu/**', '.github/workflows/mini-mogumogu-build.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'If set (e.g. mini-mogumogu-v1.0.0), also create a DRAFT GitHub release with this tag from the build'
        required: false
        default: ''
defaults:
  run:
    working-directory: vst/mini-mogumogu
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(grep -oE 'project\(MiniMogumogu VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9.]+$')" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3 (and AU on macOS)
        shell: bash
        run: |
          cmake --build build --config Release --target MiniMogumogu_VST3 --parallel
          if [ "$RUNNER_OS" = "macOS" ]; then cmake --build build --config Release --target MiniMogumogu_AU --parallel; fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/MiniMogumogu_artefacts/Release/VST3/mini mogumogu.vst3" dist/
          if [ "$RUNNER_OS" = "macOS" ]; then cp -R "build/MiniMogumogu_artefacts/Release/AU/mini mogumogu.component" dist/; fi

      # ---------------- Windows: installer
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.v }}" installer\mini-mogumogu.iss
          Get-ChildItem dist
          Remove-Item -Recurse -Force "dist\mini mogumogu.vst3"

      # ---------------- macOS: ad-hoc sign, check architectures, dmg (+ tar.gz)
      # Apple Silicon refuses unsigned code, and a zip artifact drops the Unix permission bits,
      # so the plug-ins are shipped inside a dmg / tar.gz.
      - name: Sign and package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          for b in "mini mogumogu.vst3" "mini mogumogu.component"; do
            chmod -R u+rwX,go+rX "$b"
            chmod +x "$b"/Contents/MacOS/*
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
            echo "$b architectures: $(lipo -archs "$b"/Contents/MacOS/"mini mogumogu")"
          done
          cp ../LICENSE.txt .
          cat > "はじめにお読みください.txt" <<'TXT'
          mini mogumogu インストール方法（Mac）

          1. "mini mogumogu.vst3" を ~/Library/Audio/Plug-Ins/VST3/ にコピー
          2. "mini mogumogu.component" を ~/Library/Audio/Plug-Ins/Components/ にコピー（AU を使う場合）
          3. ターミナルで次を実行（公証をしていないため必要です）
               xattr -cr "$HOME/Library/Audio/Plug-Ins/VST3/mini mogumogu.vst3"
               xattr -cr "$HOME/Library/Audio/Plug-Ins/Components/mini mogumogu.component"
          4. DAW を再起動（または再スキャン）

          詳しい使い方は https://github.com/queensighsjapan-collab/Yu_My_FX/blob/main/vst/mini-mogumogu/docs/MANUAL.md
          TXT
          sed -i '' 's/^          //' "はじめにお読みください.txt"
          tar -czf ../mini-mogumogu-macOS.tar.gz "mini mogumogu.vst3" "mini mogumogu.component"
          hdiutil create -volname "mini mogumogu" -srcfolder . -ov -format UDZO ../mini-mogumogu-macOS.dmg
          cd ..
          rm -rf dist && mkdir dist && mv mini-mogumogu-macOS.dmg mini-mogumogu-macOS.tar.gz dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: mini-mogumogu-${{ runner.os }}
          path: vst/mini-mogumogu/dist

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          ls -lR artifacts
          VER="${TAG#mini-mogumogu-v}"
          printf 'mini mogumogu v%s (Minimoog-style monophonic synth + effects + 16-step sequencer)\n\nWindows: mini-mogumogu-Setup-%s.exe (VST3 installer)\nMac: mini-mogumogu-macOS.dmg (VST3 + AU, universal, ad-hoc signed, not notarized: see the text file inside)\n' "$VER" "$VER" > notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "mini mogumogu v${VER}" --notes-file notes.md \
            artifacts/mini-mogumogu-Windows/mini-mogumogu-Setup-*.exe artifacts/mini-mogumogu-macOS/mini-mogumogu-macOS.dmg vst/mini-mogumogu/LICENSE.txt
