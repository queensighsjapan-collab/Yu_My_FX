<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>MPM103 - コードに恋するアルペジエーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1c0f27;
    --bg-panel:#2a1938;
    --bg-panel-2:#341f45;
    --accent-magenta:#ff5da2;
    --accent-purple:#9b5de5;
    --accent-gold:#ffd166;
    --text-main:#fdeffa;
    --text-muted:#c9aedb;
    --chord-major:#ff5da2;
    --chord-minor:#9b5de5;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
    --font-display:'Zen Maru Gothic', sans-serif;
    --font-body:'M PLUS Rounded 1c', sans-serif;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% -10%, rgba(255,93,162,0.28), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(155,93,229,0.30), transparent 50%),
      var(--bg-deep);
    color:var(--text-main);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }

  .app{
    width:100%;
    max-width:520px;
  }

  /* ---------- Hero ---------- */
  .hero{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:22px;
  }

  .mascot-frame{
    position:relative;
    width:84px;
    height:84px;
    flex:none;
  }

  .mascot-frame img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,0.85);
    position:relative;
    z-index:2;
    display:block;
  }

  .mascot-glow{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,93,162,0.55), rgba(155,93,229,0.15) 60%, transparent 72%);
    filter:blur(2px);
    z-index:1;
    transform:scale(1);
    transition:transform 120ms ease-out, opacity 120ms ease-out;
  }

  .hero-text h1{
    font-family:var(--font-display);
    font-weight:900;
    font-size:30px;
    margin:0 0 4px;
    letter-spacing:0.02em;
    background:linear-gradient(90deg, var(--accent-magenta), var(--accent-gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero-text p{
    margin:0;
    font-size:13.5px;
    color:var(--text-muted);
  }

  /* ---------- Panels ---------- */
  .panel{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid rgba(255,255,255,0.06);
    border-radius:var(--radius-lg);
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 18px 40px -22px rgba(0,0,0,0.6);
  }

  .panel h2{
    font-family:var(--font-display);
    font-size:14px;
    font-weight:700;
    margin:0 0 12px;
    color:var(--text-muted);
  }

  /* ---------- Upload ---------- */
  .dropzone{
    border:2px dashed rgba(255,255,255,0.22);
    border-radius:var(--radius-md);
    padding:22px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color 150ms ease, background 150ms ease;
  }

  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent-magenta);
    background:rgba(255,93,162,0.06);
  }

  .dropzone p{
    margin:0;
    font-size:14px;
    color:var(--text-main);
  }

  .dropzone span{
    display:block;
    margin-top:4px;
    font-size:12px;
    color:var(--text-muted);
  }

  #fileInput{ display:none; }

  .track-info{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    font-size:13px;
    color:var(--text-muted);
    min-height:20px;
  }

  .track-info .name{ color:var(--text-main); font-weight:500; }

  .controls-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:14px;
  }

  .play-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--accent-magenta), var(--accent-purple));
    color:#fff;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:none;
    transition:transform 100ms ease;
  }
  .play-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .play-btn:not(:disabled):active{ transform:scale(0.92); }

  .volume-wrap{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .volume-wrap label{ font-size:12px; color:var(--text-muted); white-space:nowrap; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:6px;
    border-radius:999px;
    background:rgba(255,255,255,0.14);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--accent-gold);
    cursor:pointer;
    border:2px solid rgba(0,0,0,0.2);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--accent-gold);
    cursor:pointer;
    border:2px solid rgba(0,0,0,0.2);
  }

  .speed-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .speed-btn{
    flex:1;
    padding:8px 0;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.14);
    background:transparent;
    color:var(--text-muted);
    font-family:var(--font-body);
    font-size:12.5px;
    cursor:pointer;
    transition:all 120ms ease;
  }
  .speed-btn.active{
    background:linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
    color:#fff;
    border-color:transparent;
  }

  .bpm-row{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.08);
  }

  .bpm-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
  }

  .bpm-head .bpm-label{
    font-size:12px;
    color:var(--text-muted);
  }

  .bpm-head .bpm-value{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    color:var(--text-main);
  }

  .bpm-sub{
    font-size:11px;
    color:var(--text-muted);
    margin-top:6px;
  }

  .bpm-sub .diff-plus{ color:var(--accent-gold); }
  .bpm-sub .diff-minus{ color:var(--accent-magenta); }

  .bpm-reset-row{
    display:flex;
    justify-content:flex-end;
    margin-top:6px;
  }

  .bpm-reset-btn{
    padding:4px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.16);
    background:transparent;
    color:var(--text-muted);
    font-family:var(--font-body);
    font-size:11.5px;
    cursor:pointer;
    transition:all 120ms ease;
  }
  .bpm-reset-btn:hover{
    border-color:var(--accent-gold);
    color:var(--text-main);
  }

  /* ---------- Chord readout ---------- */
  .chord-panel{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }

  .chord-label{
    font-size:12.5px;
    color:var(--text-muted);
  }

  .chord-bubble{
    font-family:var(--font-display);
    font-weight:900;
    font-size:34px;
    padding:10px 22px;
    border-radius:999px;
    background:var(--bg-deep);
    border:2px solid var(--accent-purple);
    color:var(--text-main);
    min-width:96px;
    text-align:center;
    transition:border-color 220ms ease, box-shadow 220ms ease;
  }

  .chord-bubble.major{ border-color:var(--chord-major); box-shadow:0 0 22px -6px rgba(255,93,162,0.7); }
  .chord-bubble.minor{ border-color:var(--chord-minor); box-shadow:0 0 22px -6px rgba(155,93,229,0.7); }

  .chord-sub{
    font-size:11.5px;
    color:var(--text-muted);
    margin-top:6px;
  }

  /* ---------- Pads ---------- */
  .pad-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }

  .pad{
    aspect-ratio:1/1;
    border-radius:var(--radius-sm);
    border:1px solid rgba(255,255,255,0.10);
    background:rgba(255,255,255,0.03);
    color:var(--text-main);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
    font-family:var(--font-body);
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    transition:transform 70ms ease, background 100ms ease, border-color 100ms ease;
  }

  .pad .pad-name{
    font-size:12.5px;
    font-weight:700;
  }

  .pad .pad-sub{
    font-size:9.5px;
    color:var(--text-muted);
  }

  .pad:not(.disabled):hover{
    border-color:rgba(255,255,255,0.24);
  }

  .pad.active{
    transform:scale(0.94);
    background:linear-gradient(135deg, var(--accent-magenta), var(--accent-purple));
    border-color:transparent;
  }

  .pad.active .pad-sub{ color:rgba(255,255,255,0.85); }

  .pad.disabled{
    opacity:0.32;
    cursor:not-allowed;
  }

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    margin-top:14px;
  }

  @media (max-width:380px){
    .chord-bubble{ font-size:28px; padding:8px 16px; }
    .hero-text h1{ font-size:25px; }
  }

  @media (prefers-reduced-motion:reduce){
    .mascot-glow, .pad, .play-btn{ transition:none; }
  }

  button, .pad{ font-family:inherit; }
  button:focus-visible, .pad:focus-visible, .dropzone:focus-visible{
    outline:2px solid var(--accent-gold);
    outline-offset:2px;
  }
</style>
</head>

  <div class="panel">
    <h2>1. 曲を読み込む</h2>
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="mp3ファイルを選択">
      <p id="dropzoneText">タップしてmp3を選ぶ</p>
      <span>またはここにドラッグ&ドロップ</span>
    </div>
    <input type="file" id="fileInput" accept="audio/*">
    <div class="track-info" id="trackInfo"></div>

    <div class="controls-row">
      <button class="play-btn" id="playBtn" disabled aria-label="再生・一時停止">▶</button>
      <div class="volume-wrap">
        <label for="volumeSlider">曲の音量</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>

    <div class="speed-row">
      <button class="speed-btn" data-mult="0.5">0.5倍</button>
      <button class="speed-btn active" data-mult="1">1倍</button>
      <button class="speed-btn" data-mult="2">2倍</button>
    </div>

    <div class="bpm-row">
      <div class="bpm-head">
        <span class="bpm-label">テンポ(BPM)</span>
        <span class="bpm-value" id="bpmValue">120</span>
      </div>
      <input type="range" id="bpmSlider" min="60" max="200" value="120" step="1">
      <div class="bpm-reset-row">
        <button class="bpm-reset-btn" id="bpmResetBtn" type="button">±0(検出値に戻す)</button>
      </div>
      <div class="bpm-sub" id="bpmSub">曲を読み込むと自動でテンポを検出するよ</div>
    </div>
  </div>

  <div class="panel chord-panel">
    <div>
      <div class="chord-label">いま聴こえているコード</div>
      <div class="chord-sub" id="chordSub">mp3を読み込んで再生すると解析がはじまるよ</div>
    </div>
    <div class="chord-bubble" id="chordBubble">-</div>
  </div>

  <div class="panel">
    <h2>2. パッドを押してアルペジオを鳴らす</h2>
    <div class="pad-grid" id="padGrid"></div>
    <div class="hint">パッドは押している間ずっと鳴るよ。指を離すと止まるよ。</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
(function(){

  /* ===================================================================
     1. 定数・パッド定義
  =================================================================== */

  // 12音の名前(表示用)
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  // コードテンプレート(ルートからの半音オフセット)
  const TRIAD = { major:[0,4,7], minor:[0,3,7] };

  // ルート音の基準オクターブ(MIDIノート、C4=60)
  const BASE_ROOT_MIDI = 60;

  // パターン定義: offsets はルートからの半音オフセットの配列(順番が再生順)
  // 各値は "コードの構成音インデックス的な半音オフセット" として自由に指定してよい
  function triadTones(quality){
    const t = TRIAD[quality];
    // [ルート, 3度, 5度, オクターブ上のルート]
    return [t[0], t[1], t[2], t[0]+12];
  }

  const PAD_DEFS = [
    { name:'アップ',        sub:'root→top',   rate:1,   build:q=>{const t=triadTones(q); return [t[0],t[1],t[2],t[3]];} },
    { name:'ダウン',        sub:'top→root',   rate:1,   build:q=>{const t=triadTones(q); return [t[3],t[2],t[1],t[0]];} },
    { name:'山型',          sub:'up→down',    rate:1,   build:q=>{const t=triadTones(q); return [t[0],t[1],t[2],t[3],t[2],t[1]];} },
    { name:'谷型',          sub:'down→up',    rate:1,   build:q=>{const t=triadTones(q); return [t[3],t[2],t[1],t[0],t[1],t[2]];} },
    { name:'ランダム',      sub:'random',     rate:1,   build:q=>{const t=triadTones(q); return shuffle([t[0],t[1],t[2],t[3]]);} },
    { name:'2オクターブ',   sub:'wide up',    rate:1,   build:q=>{const t=TRIAD[q]; return [t[0],t[1],t[2],t[0]+12,t[1]+12,t[2]+12,t[0]+24];} },
    { name:'とびとび',      sub:'skip',       rate:1,   build:q=>{const t=triadTones(q); return [t[0],t[2],t[1],t[3]];} },
    { name:'細かい上昇',    sub:'fast up',    rate:2,   build:q=>{const t=triadTones(q); return [t[0],t[1],t[2],t[3]];} },
    { name:'ゆったり上昇',  sub:'slow up',    rate:0.5, build:q=>{const t=triadTones(q); return [t[0],t[1],t[2],t[3]];} },
    { name:'コードそのまま',sub:'block',      rate:1,   build:q=>{const t=TRIAD[q]; return [[t[0],t[1],t[2]]];} },
    { name:'バウンド',      sub:'bounce',     rate:1,   build:q=>{const t=triadTones(q); return [t[0],t[3],t[1],t[2]];} },
    { name:'7th風',         sub:'add tone',   rate:1,   build:q=>{const t=TRIAD[q]; const seventh=q==='major'?11:10; return [t[0],t[1],t[2],seventh];} },
    { name:'オクターブ重ね',sub:'octaves',    rate:1,   build:q=>{const t=triadTones(q); return [t[0],t[0]+12,t[1],t[1]+12,t[2],t[2]+12];} },
    { name:'広めランダム',  sub:'wide random',rate:1,   build:q=>{const t=TRIAD[q]; return shuffle([t[0],t[1]+12,t[2],t[0]+24,t[1],t[2]+12]);} },
    { name:'トリル',        sub:'trill',      rate:3,   build:q=>{const t=TRIAD[q]; return [t[0],t[1],t[0],t[1]];} },
    { name:'カスケード',    sub:'cascade',    rate:1,   build:q=>{const t=TRIAD[q]; return [t[0]+12,t[2],t[1],t[0],t[2]-12,t[1]-12];} },
  ];

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  /* ===================================================================
     2. 状態
  =================================================================== */

  let player = null;
  let analyser = null;
  let meter = null;
  let isPlaying = false;
  let currentChordRoot = 0;       // 0-11
  let currentChordQuality = 'major';
  let hasChord = false;

  let chromaHistory = [];         // 疑似リアルタイム平滑化用のバッファ
  const CHROMA_HISTORY_SIZE = 4;  // 約1秒ぶん

  let speedMultiplier = 1;        // 1倍
  let detectedBPM = 120;
  let manualBPM = 120;
  let activePads = {};            // pad index -> {seq, part}

  // 音色まわり(mp3の明るさに寄せる + きらきら系エフェクト)
  let synth = null;
  let toneFilter = null;
  let chorus = null;
  let delay = null;
  let reverb = null;
  let limiter = null;

  /* ===================================================================
     3. UI組み立て
  =================================================================== */

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const dropzoneText = document.getElementById('dropzoneText');
  const trackInfo = document.getElementById('trackInfo');
  const playBtn = document.getElementById('playBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const chordBubble = document.getElementById('chordBubble');
  const chordSub = document.getElementById('chordSub');
  const mascotGlow = document.getElementById('mascotGlow');
  const padGrid = document.getElementById('padGrid');
  const speedBtns = document.querySelectorAll('.speed-btn');
  const bpmValue = document.getElementById('bpmValue');
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmSub = document.getElementById('bpmSub');
  const bpmResetBtn = document.getElementById('bpmResetBtn');

  PAD_DEFS.forEach((def, i) => {
    const pad = document.createElement('div');
    pad.className = 'pad disabled';
    pad.tabIndex = 0;
    pad.setAttribute('role','button');
    pad.setAttribute('aria-label', def.name + ' パッド');
    pad.innerHTML = `<div class="pad-name">${def.name}</div><div class="pad-sub">${def.sub}</div>`;
    padGrid.appendChild(pad);

    const start = (e) => { e.preventDefault(); triggerPad(i, pad); };
    const stop = (e) => { if(e) e.preventDefault(); releasePad(i, pad); };

    pad.addEventListener('pointerdown', start);
    pad.addEventListener('pointerup', stop);
    pad.addEventListener('pointerleave', stop);
    pad.addEventListener('pointercancel', stop);
    pad.addEventListener('keydown', (e) => { if((e.key==='Enter'||e.key===' ') && !pad.classList.contains('disabled')) start(e); });
    pad.addEventListener('keyup', (e) => { if(e.key==='Enter'||e.key===' ') stop(e); });
  });

  speedBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      speedBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      speedMultiplier = parseFloat(btn.dataset.mult);
      applyTransportBpm();
    });
  });

  bpmSlider.addEventListener('input', () => {
    manualBPM = parseFloat(bpmSlider.value);
    bpmValue.textContent = Math.round(manualBPM);
    updateBpmSub();
    applyTransportBpm();
  });

  bpmResetBtn.addEventListener('click', () => {
    manualBPM = detectedBPM;
    bpmSlider.value = detectedBPM;
    bpmValue.textContent = detectedBPM;
    updateBpmSub();
    applyTransportBpm();
  });

  function updateBpmSub(){
    const rounded = Math.round(manualBPM);
    if(rounded === detectedBPM){
      bpmSub.textContent = detectedBPM ? `自動検出: ${detectedBPM}` : '曲を読み込むと自動でテンポを検出するよ';
      return;
    }
    const diff = rounded - detectedBPM;
    const sign = diff > 0 ? '+' : '';
    const cls = diff > 0 ? 'diff-plus' : 'diff-minus';
    bpmSub.innerHTML = `検出値: ${detectedBPM} → ${rounded}(<span class="${cls}">${sign}${diff}</span>)`;
  }

  function applyTransportBpm(){
    const effective = Math.max(20, Math.min(400, manualBPM*speedMultiplier));
    Tone.Transport.bpm.rampTo(effective, 0.15);
    updateDelayTime();
  }

  function updateDelayTime(){
    if(!delay) return;
    // 付点8分音符でシンクロした「きらきら」エコーにする
    delay.delayTime.value = Tone.Time('8n.').toSeconds();
  }

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', (e) => { if(e.key==='Enter'||e.key===' ') fileInput.click(); });
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if(e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if(e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
  });

  volumeSlider.addEventListener('input', () => {
    if(player) player.volume.value = Tone.gainToDb(volumeSlider.value/100);
  });

  playBtn.addEventListener('click', async () => {
    await Tone.start();
    if(!player) return;
    if(isPlaying){
      player.stop();
      isPlaying = false;
      playBtn.textContent = '▶';
    } else {
      player.start();
      isPlaying = true;
      playBtn.textContent = '⏸';
    }
  });

  /* ===================================================================
     4. 音源読み込み・音声解析セットアップ
  =================================================================== */

  async function loadFile(file){
    if(!file.type.startsWith('audio')) {
      dropzoneText.textContent = '音声ファイルを選んでね';
      return;
    }
    dropzoneText.textContent = '読み込み中...';
    trackInfo.innerHTML = '';

    await Tone.start();

    if(player){ player.stop(); player.dispose(); }
    if(isPlaying){ isPlaying = false; playBtn.textContent = '▶'; }

    const url = URL.createObjectURL(file);

    // 音色チェーンを準備(まだ無ければ) : シンセ → フィルター → コーラス → ディレイ → リバーブ → リミッター
    if(!synth){
      toneFilter = new Tone.Filter(4000, 'lowpass');
      chorus = new Tone.Chorus({ frequency:3.2, delayTime:2.5, depth:0.5, wet:0.35 }).start();
      delay = new Tone.FeedbackDelay({ delayTime:'8n.', feedback:0.28, wet:0.22 });
      reverb = new Tone.Reverb({ decay:2.2, preDelay:0.02, wet:0.28 });
      await reverb.generate();
      limiter = new Tone.Limiter(-1).toDestination();

      toneFilter.chain(chorus, delay, reverb, limiter);

      synth = new Tone.PolySynth(Tone.Synth, {
        oscillator:{ type:'fattriangle', count:3, spread:22 },
        envelope:{ attack:0.008, decay:0.18, sustain:0.22, release:0.45 },
        volume:-10
      }).connect(toneFilter);

      updateDelayTime();
    }

    player = new Tone.Player({
      url: url,
      autostart:false,
      onload:() => {
        dropzoneText.textContent = 'べつのmp3に読み込みなおす';
        trackInfo.innerHTML = `<span class="name">${escapeHtml(file.name)}</span>`;
        playBtn.disabled = false;
        setPadsEnabled(true);
        analyseBpm();
      },
      onerror:() => {
        dropzoneText.textContent = '読み込みに失敗したよ、別のファイルで試してね';
      }
    }).toDestination();

    player.volume.value = Tone.gainToDb(volumeSlider.value/100);

    if(!analyser){ analyser = new Tone.Analyser('fft', 2048); }
    if(!meter){ meter = new Tone.Meter({ smoothing:0.8 }); }
    player.connect(analyser);
    player.connect(meter);

    player.onstop = () => {
      isPlaying = false;
      playBtn.textContent = '▶';
    };
  }

  function setPadsEnabled(enabled){
    document.querySelectorAll('.pad').forEach(p => {
      if(enabled) p.classList.remove('disabled');
      else p.classList.add('disabled');
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function analyseBpm(){
    if(!player || !player.buffer) return;
    bpmSub.textContent = 'テンポを解析中...';
    // 描画をブロックしないよう次のフレームにずらす
    setTimeout(() => {
      try{
        const audioBuffer = player.buffer.get();
        const bpm = estimateBPM(audioBuffer);
        detectedBPM = bpm;
        manualBPM = bpm;
        bpmSlider.value = bpm;
        bpmValue.textContent = bpm;
        updateBpmSub();
        applyTransportBpm();
      } catch(e){
        bpmSub.textContent = '自動検出に失敗したよ、スライダーで手動設定してね';
      }
    }, 30);
  }

  function estimateBPM(audioBuffer){
    const sr = audioBuffer.sampleRate;
    const maxSeconds = Math.min(audioBuffer.duration, 60);
    const numSamples = Math.floor(maxSeconds*sr);
    const channels = audioBuffer.numberOfChannels;

    // モノラルにミックスダウン
    const mono = new Float32Array(numSamples);
    for(let c=0; c<channels; c++){
      const chan = audioBuffer.getChannelData(c);
      for(let i=0; i<numSamples; i++){
        mono[i] += chan[i]/channels;
      }
    }

    // 音量エンベロープ(短い窓ごとのRMS)
    const windowSize = 1024;
    const hopSize = 512;
    const frameCount = Math.max(1, Math.floor((numSamples-windowSize)/hopSize));
    const envelope = new Float32Array(frameCount);
    for(let f=0; f<frameCount; f++){
      let sum = 0;
      const start = f*hopSize;
      for(let i=0; i<windowSize; i++){
        const v = mono[start+i] || 0;
        sum += v*v;
      }
      envelope[f] = Math.sqrt(sum/windowSize);
    }

    // オンセット強度(音量が急に増えた瞬間だけを拾う)
    const onset = new Float32Array(frameCount);
    for(let f=1; f<frameCount; f++){
      const d = envelope[f]-envelope[f-1];
      onset[f] = d>0 ? d : 0;
    }

    // 60〜200BPMの範囲で自己相関を取り、一番強い周期を探す
    const frameRate = sr/hopSize;
    const minBPM = 60, maxBPM = 200;
    const minLag = Math.max(1, Math.floor(frameRate*60/maxBPM));
    const maxLag = Math.floor(frameRate*60/minBPM);

    let bestLag = minLag, bestScore = -Infinity;
    for(let lag=minLag; lag<=maxLag; lag++){
      let score = 0;
      for(let f=0; f<frameCount-lag; f++){
        score += onset[f]*onset[f+lag];
      }
      // よくあるテンポ帯(だいたい90〜150あたり)に軽く寄せて、倍/半分の誤検出を減らす
      const candidateBpm = (60*frameRate)/lag;
      const prior = Math.exp(-Math.pow((candidateBpm-120)/45, 2));
      score *= (0.6 + 0.4*prior);
      if(score > bestScore){ bestScore = score; bestLag = lag; }
    }

    let bpm = (60*frameRate)/bestLag;

    // 倍/半分の誤検出をならして、よくある曲のテンポ帯に寄せる
    while(bpm < 80) bpm *= 2;
    while(bpm > 175) bpm /= 2;

    return Math.round(bpm);
  }

  /* ===================================================================
     5. コード解析(疑似リアルタイム)
  =================================================================== */

  function analyseLoop(){
    if(player && isPlaying && analyser){
      const values = analyser.getValue(); // dB配列
      const chroma = new Array(12).fill(0);
      const sampleRate = Tone.getContext().sampleRate;
      const binCount = values.length;
      const nyquist = sampleRate/2;

      let centroidNum = 0, centroidDen = 0;

      for(let i=1;i<binCount;i++){
        const freq = (i/binCount) * nyquist;
        if(freq < 55 || freq > 1760) continue; // A1〜A6くらいの音楽的レンジ
        const db = values[i];
        if(!isFinite(db)) continue;
        const mag = Math.pow(10, db/20);
        if(mag < 0.0001) continue;

        const noteNum = 69 + 12*Math.log2(freq/440);
        let pc = Math.round(noteNum) % 12;
        if(pc < 0) pc += 12;
        chroma[pc] += mag;

        centroidNum += freq*mag;
        centroidDen += mag;
      }

      // 正規化
      const maxV = Math.max(...chroma, 1e-9);
      const normChroma = chroma.map(v => v/maxV);

      chromaHistory.push(normChroma);
      if(chromaHistory.length > CHROMA_HISTORY_SIZE) chromaHistory.shift();

      // 平滑化(疑似リアルタイム = 直近数回の平均)
      const avgChroma = new Array(12).fill(0);
      chromaHistory.forEach(c => c.forEach((v,i) => avgChroma[i]+=v));
      for(let i=0;i<12;i++) avgChroma[i] /= chromaHistory.length;

      const totalEnergy = avgChroma.reduce((a,b)=>a+b,0);

      if(totalEnergy > 0.6){
        const best = matchChordTemplate(avgChroma);
        if(best){
          currentChordRoot = best.root;
          currentChordQuality = best.quality;
          hasChord = true;
          updateChordUI();
        }
      }

      // 音色を曲の明るさに寄せる
      if(centroidDen > 0 && toneFilter){
        const centroid = centroidNum/centroidDen; // だいたい 100〜3000Hz
        const cutoff = Math.min(9000, Math.max(500, centroid*2.4));
        toneFilter.frequency.rampTo(cutoff, 0.4);
        const oscType = centroid > 900 ? 'fatsawtooth' : (centroid > 400 ? 'fattriangle' : 'fatsine');
        if(synth && synth._oscType !== oscType){
          synth._oscType = oscType;
          synth.set({ oscillator:{ type: oscType } });
        }
      }
    }

    // マスコットの光をボリュームに合わせて呼吸させる
    if(meter && mascotGlow){
      const level = meter.getValue();
      const norm = isFinite(level) ? Math.min(1, Math.max(0, (level+50)/50)) : 0;
      const scale = 1 + norm*0.35;
      mascotGlow.style.transform = `scale(${scale})`;
      mascotGlow.style.opacity = 0.5 + norm*0.5;
    }

    requestAnimationFrame(analyseLoop);
  }
  requestAnimationFrame(analyseLoop);

  function matchChordTemplate(chroma){
    let bestScore = -1, bestRoot = 0, bestQuality = 'major';
    for(let root=0; root<12; root++){
      for(const quality of ['major','minor']){
        const tones = TRIAD[quality].map(o => (root+o)%12);
        let score = 0;
        tones.forEach((pc, idx) => {
          const weight = idx===0 ? 1.3 : 1.0; // ルート音を少し重視
          score += chroma[pc]*weight;
        });
        // コードに含まれない音は少し減点(誤検出を減らす)
        for(let pc=0; pc<12; pc++){
          if(!tones.includes(pc)) score -= chroma[pc]*0.15;
        }
        if(score > bestScore){
          bestScore = score;
          bestRoot = root;
          bestQuality = quality;
        }
      }
    }
    return { root: bestRoot, quality: bestQuality, score: bestScore };
  }

  function updateChordUI(){
    const name = NOTE_NAMES[currentChordRoot] + (currentChordQuality==='minor' ? 'm' : '');
    chordBubble.textContent = name;
    chordBubble.classList.remove('major','minor');
    chordBubble.classList.add(currentChordQuality==='minor' ? 'minor' : 'major');
    chordSub.textContent = '約1秒前の音をもとに推定してるよ(多少ずれることがあります)';
  }

  /* ===================================================================
     6. パッド再生
  =================================================================== */

  function triggerPad(index, el){
    if(el.classList.contains('disabled')) return;
    if(!hasChord){
      chordSub.textContent = 'まず再生してコードを検出してね';
      return;
    }
    el.classList.add('active');

    const def = PAD_DEFS[index];
    const rootMidi = BASE_ROOT_MIDI + currentChordRoot;
    const offsets = def.build(currentChordQuality);

    const notes = offsets.map(o => {
      if(Array.isArray(o)){
        return o.map(n => Tone.Frequency(rootMidi+n, 'midi').toNote());
      }
      return Tone.Frequency(rootMidi+o, 'midi').toNote();
    });

    const subdivision = scaleRate('8n', def.rate);

    const seq = new Tone.Sequence((time, note) => {
      synth.triggerAttackRelease(note, subdivision, time);
    }, notes, subdivision).start(0);

    if(Tone.Transport.state !== 'started') Tone.Transport.start();

    activePads[index] = seq;
  }

  function releasePad(index, el){
    el.classList.remove('active');
    const seq = activePads[index];
    if(seq){
      seq.stop();
      seq.dispose();
      delete activePads[index];
    }
    if(Object.keys(activePads).length === 0 && Tone.Transport.state === 'started'){
      Tone.Transport.stop();
    }
  }

  function scaleRate(base, factor){
    // globalRateの数値をfactorに応じて速く/遅くする(簡易実装)
    const map = { '4n':4, '8n':8, '16n':16 };
    const baseVal = map[base] || 8;
    let scaled = Math.round(baseVal*factor);
    scaled = Math.max(2, Math.min(32, scaled));
    const nearest = [2,4,8,16,32].reduce((a,b)=> Math.abs(b-scaled)<Math.abs(a-scaled)?b:a);
    return nearest + 'n';
  }

})();
</script>
