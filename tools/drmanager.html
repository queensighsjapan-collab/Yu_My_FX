    background-size:260px 260px;
    background-repeat:repeat;
    border-radius:18px; border:6px solid var(--panel-edge); padding:20px 18px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .screws{ display:flex; justify-content:space-between; margin-bottom:10px; }
  .screw{
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #ccc, #555 70%);
    box-shadow:inset 0 0 2px #000;
  }

  .knob-rack{
    background:rgba(0,0,0,0.35); border-radius:12px; padding:12px 10px 8px;
    display:flex; justify-content:space-between; margin-bottom:16px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.5);
  }
  .knob-col{ display:flex; flex-direction:column; align-items:center; gap:6px; width:23%; }
  .knob{
    width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a2a2a, #050505 75%);
    border:2px solid #000; position:relative; cursor:ns-resize;
    box-shadow:0 3px 6px rgba(0,0,0,0.6);
  }
  .knob::after{
    content:''; position:absolute; top:4px; left:50%; width:2px; height:16px;
    background:var(--amber); transform-origin:bottom center; transform:translateX(-50%) rotate(var(--rot,0deg));
    box-shadow:0 0 4px var(--amber);
  }
  .knob-label{ font-size:14px; letter-spacing:1px; color:var(--text-dim); text-align:center; }
  .knob-value{ font-size:14px; color:var(--amber); }

  .display-panel{
    background:#0d0f0a; border:2px solid #000; border-radius:10px; padding:10px 14px;
    margin-bottom:16px; box-shadow:inset 0 0 12px rgba(0,0,0,0.7);
  }
  .display-row{ display:flex; justify-content:space-between; align-items:center; font-size:15px; color:var(--cyan); margin-bottom:4px; }
  .display-row .padname{ color:var(--amber); font-size:18px; letter-spacing:1px; }
  .display-sub{ font-size:14px; color:var(--text-dim); }

  .pad-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
  }
  .pad{
    position:relative; aspect-ratio:1; border-radius:10px;
    background:linear-gradient(160deg, #26281f, var(--pad));
    border:1px solid var(--pad-edge); box-shadow:0 4px 0 var(--pad-edge), inset 0 0 0 1px rgba(255,255,255,0.03);
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:.05s;
    min-width:0; overflow:hidden; /* テキストが長くてもグリッドセルが広がらないようにする */
  }
  .pad:active{
    transform:translateY(3px); box-shadow:0 1px 0 var(--pad-edge);
  }
  .pad.playing{
    background:linear-gradient(160deg, #4a5a26, #2a3018);
    border-color:var(--amber);
    box-shadow:0 4px 0 var(--pad-edge), 0 0 14px 4px rgba(255,176,32,0.75), inset 0 0 10px rgba(255,176,32,0.35);
    animation:padGlow 0.6s ease-in-out infinite alternate;
  }
  @keyframes padGlow{
    from{ box-shadow:0 4px 0 var(--pad-edge), 0 0 14px 4px rgba(255,176,32,0.75), inset 0 0 10px rgba(255,176,32,0.35); }
    to{ box-shadow:0 4px 0 var(--pad-edge), 0 0 20px 7px rgba(255,176,32,0.95), inset 0 0 14px rgba(255,176,32,0.5); }
  }
  .pad.empty{ opacity:0.45; }
  .pad .pnum{ position:absolute; top:4px; left:6px; font-size:12px; color:var(--text-dim); }
  .pad .pname{
    font-size:14px; color:var(--text); text-align:center; padding:0 6px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; max-width:100%;
  }
  .pad .pmode{ font-size:11px; color:var(--amber); margin-top:2px; letter-spacing:1px; }
  .pad .gear{
    position:absolute; top:3px; right:4px; font-size:16px; color:var(--text-dim);
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    border-radius:4px;
  }
  .pad .gear:hover{ color:var(--amber); background:rgba(255,255,255,0.08); }
  .pad.selected{ box-shadow:0 4px 0 var(--pad-edge), 0 0 0 2px var(--amber); }

  .footer-row{ display:flex; justify-content:space-between; margin-top:16px; gap:8px; }
  .footer-row button{
    flex:1; background:#161611; border:1px solid #000; color:var(--text-dim);
    padding:8px 4px; font-family:inherit; font-size:14px; letter-spacing:1px; border-radius:6px; cursor:pointer;
  }
  .footer-row button:hover{ color:var(--amber); border-color:var(--amber); }
  .footer-row button.danger:hover{ color:var(--red); border-color:var(--red); }

  /* ---- 設定モーダル ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none;
    align-items:center; justify-content:center; z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#151711; border:2px solid var(--amber); border-radius:10px; padding:20px;
    width:90%; max-width:340px;
  }
  .modal h3{ margin:0 0 14px; font-size:18px; color:var(--amber); letter-spacing:1px; }
  .modal-row{ margin-bottom:12px; }
  .modal-row label{ display:block; font-size:14px; color:var(--text-dim); margin-bottom:4px; letter-spacing:1px; }
  .modal-row select, .modal-row input[type=text]{
    width:100%; background:#0a0a08; border:1px solid #333; color:var(--text);
    font-family:inherit; font-size:16px; padding:6px 8px; border-radius:4px;
  }
  .mode-btns, .fx-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .mode-btns button, .fx-btns button{
    flex:1; min-width:70px; background:#0a0a08; border:1px solid #333; color:var(--text-dim);
    padding:7px 4px; font-family:inherit; font-size:14px; border-radius:4px; cursor:pointer;
  }
  .mode-btns button.active, .fx-btns button.active{ border-color:var(--amber); color:var(--amber); background:rgba(255,176,32,0.1); }
  .modal-actions{ display:flex; gap:8px; margin-top:16px; }
  .modal-actions button{
    flex:1; background:#0a0a08; border:1px solid var(--amber); color:var(--amber);
    padding:9px; font-family:inherit; font-size:15px; border-radius:5px; cursor:pointer; letter-spacing:1px;
  }
  .modal-actions button.close{ border-color:#555; color:var(--text-dim); }
  .loader-label{
    display:block; text-align:center; border:1px dashed #444; border-radius:5px; padding:10px;
    font-size:15px; color:var(--text-dim); cursor:pointer;
  }
  .loader-label:hover{ border-color:var(--amber); color:var(--amber); }
  input[type=file]{ display:none; }
</style>
</head>
<body>

<header>
  <h1>Dr.<span>Manager</span></h1>
  <div class="tag">MP3 PAD SAMPLER</div>
</header>

<div class="device">
  <div class="screws"><div class="screw"></div><div class="screw"></div></div>

  <div class="knob-rack" id="knobRack"></div>

  <div class="display-panel">
    <div class="display-row">
      <span class="padname" id="dispName">- NO PAD SELECTED -</span>
      <span id="dispMode">-</span>
    </div>
    <div class="display-sub" id="dispFx">FX: -</div>
  </div>

  <div class="pad-grid" id="padGrid"></div>

  <div class="footer-row">
    <button id="stopAllBtn" class="danger">■ ALL STOP</button>
    <button id="saveKitBtn">💾 KIT保存</button>
    <button id="loadKitBtn">📂 KIT読込</button>
    <input type="file" id="kitInput" accept=".json" style="display:none;">
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">PAD 1 設定</h3>
    <div class="modal-row">
      <label>音声ファイル</label>
      <label class="loader-label" id="fileLoaderLabel">+ mp3を選択</label>
      <input type="file" id="padFileInput" accept="audio/*">
      <div class="display-sub" id="modalFileName" style="margin-top:6px;">未読み込み</div>
    </div>
    <div class="modal-row">
      <label>再生モード</label>
      <div class="mode-btns" id="modeBtns">
        <button data-mode="oneshot">ONE-SHOT</button>
        <button data-mode="loop">LOOP</button>
        <button data-mode="touch">TOUCH</button>
      </div>
    </div>
    <div class="modal-row">
      <label>エフェクト</label>
      <div class="fx-btns" id="fxBtns">
        <button data-fx="none">NONE</button>
        <button data-fx="delay">DELAY</button>
        <button data-fx="filter">FILTER</button>
        <button data-fx="reverb">REVERB</button>
        <button data-fx="flanger">FLANGER</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="close" id="modalCloseBtn">閉じる</button>
      <button id="modalClearBtn">パッドを空にする</button>
    </div>
  </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const masterGain = audioCtx.createGain();
masterGain.connect(audioCtx.destination);

const NUM_PADS = 9; // 3列 × 3段(テンキー対応)
const FX_TYPES = {
  none:    { label:'NONE', knobs:[] },
  delay:   { label:'DELAY', knobs:[
    { key:'time', label:'TIME', min:0, max:1, def:0.3, fmt:v=>Math.round(v*1000)+'ms' },
    { key:'feedback', label:'FEEDBACK', min:0, max:0.9, def:0.35, fmt:v=>Math.round(v*100)+'%' },
    { key:'tone', label:'TONE', min:200, max:12000, def:6000, fmt:v=>Math.round(v)+'Hz' },
    { key:'mix', label:'MIX', min:0, max:1, def:0.4, fmt:v=>Math.round(v*100)+'%' }
  ]},
  filter:  { label:'FILTER', knobs:[
    { key:'cutoff', label:'CUTOFF', min:100, max:12000, def:8000, fmt:v=>Math.round(v)+'Hz' },
    { key:'resonance', label:'RESO', min:0.1, max:20, def:1, fmt:v=>v.toFixed(1) },
    { key:'mix', label:'MIX', min:0, max:1, def:1, fmt:v=>Math.round(v*100)+'%' },
    { key:'unused', label:'-', min:0, max:1, def:0, fmt:()=>'-' }
  ]},
  reverb:  { label:'REVERB', knobs:[
    { key:'size', label:'SIZE', min:0.3, max:5, def:2.2, fmt:v=>v.toFixed(1)+'s' },
    { key:'decay', label:'DECAY', min:0.5, max:5, def:2, fmt:v=>v.toFixed(1) },
    { key:'tone', label:'TONE', min:500, max:12000, def:7000, fmt:v=>Math.round(v)+'Hz' },
    { key:'mix', label:'MIX', min:0, max:1, def:0.35, fmt:v=>Math.round(v*100)+'%' }
  ]},
  flanger: { label:'FLANGER', knobs:[
    { key:'rate', label:'RATE', min:0.05, max:8, def:0.5, fmt:v=>v.toFixed(2)+'Hz' },
    { key:'depth', label:'DEPTH', min:0, max:0.01, def:0.003, fmt:v=>(v*1000).toFixed(1)+'ms' },
    { key:'feedback', label:'FEEDBACK', min:0, max:0.9, def:0.4, fmt:v=>Math.round(v*100)+'%' },
    { key:'mix', label:'MIX', min:0, max:1, def:0.5, fmt:v=>Math.round(v*100)+'%' }
  ]}
};

function defaultFxParams(fxType){
  const params = {};
  (FX_TYPES[fxType].knobs || []).forEach(k => { params[k.key] = k.def; });
  return params;
}

function generateImpulseResponse(ctx, duration, decay){
  const rate = ctx.sampleRate;
  const length = Math.floor(rate * duration);
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++){
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay);
  }
  return impulse;
}

// ---------- パッドの音声グラフ構築 ----------
function buildPadChain(pad){
  const input = audioCtx.createGain();
  const dry = audioCtx.createGain();
  const output = audioCtx.createGain();
  input.connect(dry); dry.connect(output);

  // フィルター
  const filterNode = audioCtx.createBiquadFilter();
  filterNode.type = 'lowpass'; filterNode.frequency.value = 8000; filterNode.Q.value = 1;
  const filterWet = audioCtx.createGain(); filterWet.gain.value = 0;
  input.connect(filterNode); filterNode.connect(filterWet); filterWet.connect(output);

  // ディレイ
  const delayNode = audioCtx.createDelay(1.0);
  const delayFeedback = audioCtx.createGain(); delayFeedback.gain.value = 0.35;
  const delayTone = audioCtx.createBiquadFilter(); delayTone.type = 'lowpass'; delayTone.frequency.value = 6000;
  delayNode.connect(delayTone); delayTone.connect(delayFeedback); delayFeedback.connect(delayNode);
  const delayWet = audioCtx.createGain(); delayWet.gain.value = 0;
  input.connect(delayNode); delayNode.connect(delayWet); delayWet.connect(output);

  // フランジャー(短いモジュレーションディレイ)
  const flangerDelay = audioCtx.createDelay(0.05);
  flangerDelay.delayTime.value = 0.003;
  const flangerLFO = audioCtx.createOscillator();
  flangerLFO.frequency.value = 0.5;
  const flangerLFOGain = audioCtx.createGain();
  flangerLFOGain.gain.value = 0.003;
  flangerLFO.connect(flangerLFOGain); flangerLFOGain.connect(flangerDelay.delayTime);
  flangerLFO.start();
  const flangerFeedback = audioCtx.createGain(); flangerFeedback.gain.value = 0.4;
  flangerDelay.connect(flangerFeedback); flangerFeedback.connect(flangerDelay);
  const flangerWet = audioCtx.createGain(); flangerWet.gain.value = 0;
  input.connect(flangerDelay); flangerDelay.connect(flangerWet); flangerWet.connect(output);

  // リバーブ
  const reverbNode = audioCtx.createConvolver();
  reverbNode.buffer = generateImpulseResponse(audioCtx, 2.2, 2);
  const reverbTone = audioCtx.createBiquadFilter(); reverbTone.type = 'lowpass'; reverbTone.frequency.value = 7000;
  const reverbWet = audioCtx.createGain(); reverbWet.gain.value = 0;
  input.connect(reverbNode); reverbNode.connect(reverbTone); reverbTone.connect(reverbWet); reverbWet.connect(output);

  output.connect(masterGain);

  return {
    input, output, dry,
    filterNode, filterWet,
    delayNode, delayFeedback, delayTone, delayWet,
    flangerDelay, flangerLFOGain, flangerFeedback, flangerWet,
    reverbNode, reverbTone, reverbWet
  };
}

function applyFxParamsToChain(pad){
  const chain = pad.chain;
  // 一旦すべてbypass(wet=0)にしてから、選ばれているエフェクトだけ有効化する
  chain.filterWet.gain.value = 0;
  chain.delayWet.gain.value = 0;
  chain.flangerWet.gain.value = 0;
  chain.reverbWet.gain.value = 0;
  chain.dry.gain.value = 1;

  const p = pad.fxParams;
  if (pad.fxType === 'filter'){
    chain.filterNode.frequency.value = p.cutoff;
    chain.filterNode.Q.value = p.resonance;
    chain.filterWet.gain.value = p.mix;
    chain.dry.gain.value = 1 - p.mix;
  } else if (pad.fxType === 'delay'){
    chain.delayNode.delayTime.value = p.time;
    chain.delayFeedback.gain.value = p.feedback;
    chain.delayTone.frequency.value = p.tone;
    chain.delayWet.gain.value = p.mix;
  } else if (pad.fxType === 'flanger'){
    chain.flangerLFOGain.gain.value = p.depth;
    chain.flangerFeedback.gain.value = p.feedback;
    chain.flangerWet.gain.value = p.mix;
  } else if (pad.fxType === 'reverb'){
    chain.reverbTone.frequency.value = p.tone;
    chain.reverbWet.gain.value = p.mix;
  }
}

// ---------- パッド状態 ----------
let pads = [];
for (let i = 0; i < NUM_PADS; i++){
  pads.push({
    index: i, name: '', buffer: null, fileName: '',
    mode: 'oneshot', fxType: 'none', fxParams: {},
    chain: buildPadChain(null),
    activeSources: [], isPlaying: false
  });
}
let selectedPad = 0;
let editingPad = null;

const padGrid = document.getElementById('padGrid');
const knobRack = document.getElementById('knobRack');

function renderPads(){
  padGrid.innerHTML = '';
  pads.forEach((pad, i) => {
    const el = document.createElement('div');
    el.className = 'pad' + (pad.buffer ? '' : ' empty') + (pad.isPlaying ? ' playing' : '') + (selectedPad === i ? ' selected' : '');
    el.innerHTML = `
      <div class="pnum">${i+1}</div>
      <div class="gear">⚙</div>
      <div class="pname">${pad.name || '(EMPTY)'}</div>
      <div class="pmode">${pad.buffer ? pad.mode.toUpperCase() : ''}</div>
    `;
    el.querySelector('.gear').addEventListener('click', (ev) => { ev.stopPropagation(); openPadModal(i); });
    el.addEventListener('mousedown', (ev) => { if (ev.target.classList.contains('gear')) return; triggerPad(i); });
    el.addEventListener('mouseup', () => releasePad(i));
    el.addEventListener('mouseleave', () => releasePad(i));
    padGrid.appendChild(el);
  });
}

function selectPad(i){
  selectedPad = i;
  renderPads();
  renderKnobs();
  renderDisplay();
}

function renderDisplay(){
  const pad = pads[selectedPad];
  document.getElementById('dispName').textContent = pad.buffer ? `PAD ${selectedPad+1}: ${pad.name}` : `PAD ${selectedPad+1}: (EMPTY)`;
  document.getElementById('dispMode').textContent = pad.buffer ? pad.mode.toUpperCase() : '-';
  document.getElementById('dispFx').textContent = 'FX: ' + FX_TYPES[pad.fxType].label;
}

// ---------- ノブ ----------
function renderKnobs(){
  knobRack.innerHTML = '';
  const pad = pads[selectedPad];
  const knobs = FX_TYPES[pad.fxType].knobs;
  for (let k = 0; k < 4; k++){
    const col = document.createElement('div');
    col.className = 'knob-col';
    if (!knobs[k]){
      col.innerHTML = `<div class="knob" style="opacity:0.25;"></div><div class="knob-label">-</div><div class="knob-value">-</div>`;
      knobRack.appendChild(col);
      continue;
    }
    const kdef = knobs[k];
    const val = pad.fxParams[kdef.key] !== undefined ? pad.fxParams[kdef.key] : kdef.def;
    const knobEl = document.createElement('div');
    knobEl.className = 'knob';
    const ratio = (val - kdef.min) / (kdef.max - kdef.min);
    knobEl.style.setProperty('--rot', (ratio * 270 - 135) + 'deg');
    const label = document.createElement('div');
    label.className = 'knob-label';
    label.textContent = kdef.label;
    const valueEl = document.createElement('div');
    valueEl.className = 'knob-value';
    valueEl.textContent = kdef.fmt(val);

    knobEl.addEventListener('mousedown', (ev) => startKnobDrag(ev, pad, kdef, knobEl, valueEl));
    col.appendChild(knobEl); col.appendChild(label); col.appendChild(valueEl);
    knobRack.appendChild(col);
  }
}
let knobDragging = null;
function startKnobDrag(ev, pad, kdef, knobEl, valueEl){
  ev.preventDefault();
  knobDragging = { pad, kdef, knobEl, valueEl, startY: ev.clientY, startVal: pad.fxParams[kdef.key] };
}
document.addEventListener('mousemove', (e) => {
  if (!knobDragging) return;
  const { pad, kdef, knobEl, valueEl, startY, startVal } = knobDragging;
  const dy = startY - e.clientY;
  const range = kdef.max - kdef.min;
  const newVal = Math.max(kdef.min, Math.min(kdef.max, startVal + (dy / 150) * range));
  pad.fxParams[kdef.key] = newVal;
  const ratio = (newVal - kdef.min) / range;
  knobEl.style.setProperty('--rot', (ratio * 270 - 135) + 'deg');
  valueEl.textContent = kdef.fmt(newVal);
  applyFxParamsToChain(pad);
});
document.addEventListener('mouseup', () => { knobDragging = null; });

// ---------- 再生 ----------
function triggerPad(i){
  const pad = pads[i];
  if (!pad.buffer) { openPadModal(i); return; }
  selectPad(i);
  if (pad.mode === 'oneshot'){
    playOneShot(pad);
  } else if (pad.mode === 'loop'){
    if (pad.isPlaying){ stopPad(pad); }
    else { playLoop(pad); }
  } else if (pad.mode === 'touch'){
    playTouch(pad);
  }
  renderPads();
}
function releasePad(i){
  const pad = pads[i];
  if (pad.mode === 'touch' && pad.isPlaying){
    stopPad(pad);
    renderPads();
  }
}
function playOneShot(pad){
  const src = audioCtx.createBufferSource();
  src.buffer = pad.buffer;
  src.connect(pad.chain.input);
  src.start();
  pad.activeSources.push(src);
  pad.isPlaying = true;
  src.onended = () => {
    pad.activeSources = pad.activeSources.filter(s => s !== src);
    if (pad.activeSources.length === 0 && pad.mode === 'oneshot') { pad.isPlaying = false; renderPads(); }
  };
}
function playLoop(pad){
  const src = audioCtx.createBufferSource();
  src.buffer = pad.buffer;
  src.loop = true;
  src.connect(pad.chain.input);
  src.start();
  pad.activeSources.push(src);
  pad.isPlaying = true;
}
function playTouch(pad){
  if (pad.isPlaying) return;
  const src = audioCtx.createBufferSource();
  src.buffer = pad.buffer;
  src.loop = true;
  src.connect(pad.chain.input);
  src.start();
  pad.activeSources = [src];
  pad.isPlaying = true;
}
function stopPad(pad){
  pad.activeSources.forEach(s => { try { s.stop(); } catch(e){} });
  pad.activeSources = [];
  pad.isPlaying = false;
}
document.getElementById('stopAllBtn').addEventListener('click', () => {
  pads.forEach(stopPad);
  renderPads();
});

// ---------- パッド設定モーダル ----------
const modalOverlay = document.getElementById('modalOverlay');
function openPadModal(i){
  editingPad = i;
  const pad = pads[i];
  document.getElementById('modalTitle').textContent = `PAD ${i+1} 設定`;
  document.getElementById('modalFileName').textContent = pad.fileName || '未読み込み';
  document.querySelectorAll('#modeBtns button').forEach(b => b.classList.toggle('active', b.dataset.mode === pad.mode));
  document.querySelectorAll('#fxBtns button').forEach(b => b.classList.toggle('active', b.dataset.fx === pad.fxType));
  modalOverlay.classList.add('open');
}
document.getElementById('modalCloseBtn').addEventListener('click', () => {
  modalOverlay.classList.remove('open');
  renderPads(); renderKnobs(); renderDisplay();
});
document.querySelectorAll('#modeBtns button').forEach(b => {
  b.addEventListener('click', () => {
    pads[editingPad].mode = b.dataset.mode;
    document.querySelectorAll('#modeBtns button').forEach(x => x.classList.toggle('active', x === b));
  });
});
document.querySelectorAll('#fxBtns button').forEach(b => {
  b.addEventListener('click', () => {
    const pad = pads[editingPad];
    pad.fxType = b.dataset.fx;
    pad.fxParams = defaultFxParams(pad.fxType);
    applyFxParamsToChain(pad);
    document.querySelectorAll('#fxBtns button').forEach(x => x.classList.toggle('active', x === b));
  });
});
document.getElementById('fileLoaderLabel').addEventListener('click', () => document.getElementById('padFileInput').click());
document.getElementById('padFileInput').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    audioCtx.decodeAudioData(reader.result.slice(0), (buffer) => {
      const pad = pads[editingPad];
      pad.buffer = buffer;
      pad.fileName = f.name;
      pad.name = f.name.replace(/\.[^.]+$/, '').slice(0, 14);
      document.getElementById('modalFileName').textContent = f.name;
    }, (err) => alert('読み込み失敗: ' + err));
  };
  reader.readAsArrayBuffer(f);
  e.target.value = '';
});
document.getElementById('modalClearBtn').addEventListener('click', () => {
  const pad = pads[editingPad];
  stopPad(pad);
  pad.buffer = null; pad.fileName = ''; pad.name = '';
  document.getElementById('modalFileName').textContent = '未読み込み';
});

// ---------- キーボード操作(テンキー配列) ----------
// 上段789 / 中段456 / 下段123 を、3列×3段のパッドグリッドにそのまま割り当てる
const KEY_TO_PAD = {
  '7':0, '8':1, '9':2,
  '4':3, '5':4, '6':5,
  '1':6, '2':7, '3':8
};
const heldKeys = new Set();
document.addEventListener('keydown', (e) => {
  if (modalOverlay.classList.contains('open')) return; // 設定中は誤発音させない
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const padIndex = KEY_TO_PAD[e.key];
  if (padIndex === undefined || padIndex >= pads.length) return;
  if (heldKeys.has(e.key)) return; // キーリピートで再トリガーしない
  heldKeys.add(e.key);
  e.preventDefault();
  triggerPad(padIndex);
});
document.addEventListener('keyup', (e) => {
  heldKeys.delete(e.key);
  const padIndex = KEY_TO_PAD[e.key];
  if (padIndex === undefined || padIndex >= pads.length) return;
  releasePad(padIndex);
});

// ---------- 初期化 ----------
renderPads();
renderKnobs();
renderDisplay();
</script>
</body>
</html>
